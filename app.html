<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Grocery Report App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Inter:wght@400..500&display=swap" rel="stylesheet">
<style>
/* App de escritorio editorial: titulares serif, lienzo blanco, tarjetas niebla, un único acento melocotón */
:root{color-scheme:light;
  --ink:#17191c;--paper:#ffffff;--mist:#f2f2f3;--fog:#fafafb;--slate:#777b86;--ash:#979799;--smoke:#a3a6af;--peach:#fbe1d1;--sienna:#5d2a1a;--hair:#ececec;
  --papel:var(--paper);--sup:var(--mist);--linea:var(--hair);--tinta:var(--ink);--suave:var(--slate);
  --azul:var(--ink);--azul-s:var(--mist);--rosa:var(--sienna);--rosa-s:var(--peach);
  --ok:var(--ink);--aviso:var(--sienna);--ko:var(--sienna);--gris:var(--smoke);--ocre:var(--sienna);--ember:var(--sienna);--blue:var(--ink);
  --serif:'Source Serif 4','Tiempos Headline',Georgia,serif;
  --ui:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--ui);--plex:var(--ui);--disp:var(--serif);
  --float:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --pop:0 0 0 1px rgba(0,0,0,.05),0 8px 40px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.5;overflow-x:hidden;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.15}
h3{font-family:var(--ui);font-weight:500;letter-spacing:-.009em;line-height:1.3}
.b{color:inherit}
h1 .b,h2 .b{font-style:italic}
.lab,.eyebrow{font-weight:400;font-size:14px;color:var(--ash);letter-spacing:0;text-transform:none}
.note{font-size:13px;color:var(--slate);margin-top:14px}
.num{font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--slate)}
.card{background:var(--mist);border-radius:24px}
.chip{display:inline-block;font-size:13px;color:var(--slate);background:var(--paper);padding:2px 10px;border-radius:9999px;white-space:nowrap}
.btn{font-size:14px;font-weight:400;height:40px;padding:0 18px;border-radius:9999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.s,.btn.g{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.up-g,.up-r,.up-n{display:inline-block;font-size:12px;font-weight:450;padding:1px 9px;border-radius:9999px;white-space:nowrap}
.up-g{background:var(--paper);color:var(--ink)}
.up-r{background:var(--peach);color:var(--sienna)}
.up-n{background:var(--paper);color:var(--slate)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--fog);border-right:1px solid var(--hair);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;padding:0 10px 28px}
.logo em{font-style:italic}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:9999px;border:none;background:none;cursor:pointer;color:var(--slate);text-align:left;margin-bottom:2px;font-size:15px}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.05)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--ash)}
.side .foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--hair)}
.avatar{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.avatar i{width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--sienna);display:grid;place-items:center;font-style:normal;font-weight:500;font-size:12px;flex:none}
.main{min-width:0}
.top{display:flex;align-items:flex-end;gap:12px;padding:36px 40px 24px;flex-wrap:wrap}
.top .t{margin-right:auto}
.top h1{font-size:clamp(36px,4vw,52px);margin-top:4px}
.demo{font-size:13px;color:var(--slate);background:var(--mist);padding:6px 12px;border-radius:9999px}
.content{padding:0 40px 80px;max-width:1280px}

/* bloques */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:20px 22px;background:var(--paper);box-shadow:var(--float);border-radius:20px}
.kpi .v{font-weight:500;font-size:28px;letter-spacing:-.015em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .v.b{color:var(--ink)}
.kpi .d{font-size:13px;color:var(--slate)}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pn{padding:24px}
.pn-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.pn-h h3{font-size:18px}
svg text{font-family:var(--ui);font-weight:400}
.hb{display:grid;grid-template-columns:130px 1fr 76px;gap:12px;align-items:center;margin-bottom:12px;cursor:pointer;font-size:14px}
.hb .tr{height:6px;background:var(--paper);border-radius:9999px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:9999px}
.hb .tr i.g{background:var(--smoke);height:2px;top:auto;bottom:0}
.hb span:last-child{text-align:right}
.alert{margin-top:16px;padding:20px 24px;border-radius:24px;background:var(--peach);color:var(--sienna);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.alert b{font-weight:500;white-space:nowrap}
.alert span b{color:var(--sienna)!important}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:400;font-size:13px;color:var(--ash);text-align:left;padding:10px 12px;border-bottom:1px solid var(--hair);white-space:nowrap;background:none}
td{padding:12px;border-bottom:1px solid var(--hair)}
.card td{border-bottom-color:#e4e4e6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--paper)}
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tools input,.tools select,.drawer select{border:1px solid var(--hair);background:var(--paper);border-radius:16px;padding:10px 16px;font-size:14px}
.tools input::placeholder{color:var(--smoke)}
.drawer select{padding:5px 10px;font-size:13px;border-radius:9999px}
.tools input{flex:1;min-width:200px}
.seg{display:inline-flex;gap:2px;background:var(--mist);padding:3px;border-radius:9999px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:9999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--slate)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.mini div{border-radius:16px;padding:12px 14px;background:var(--paper)}
.drawer .mini div{background:var(--mist)}
.mini .num{font-size:18px;display:block;margin-top:2px}
.list-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #e4e4e6;flex-wrap:wrap}
.list-item input{width:18px;height:18px;accent-color:var(--ink)}
.list-item.done .nm{text-decoration:line-through;color:var(--smoke)}
.list-item .nm{flex:1;min-width:160px}
.bar-due{width:90px;height:6px;background:var(--paper);border-radius:9999px;overflow:hidden}
.bar-due i{display:block;height:100%;background:var(--ink)}
.prog{height:6px;background:var(--paper);border-radius:9999px;overflow:hidden;margin:16px 0 8px}
.modal .prog{background:var(--mist)}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s}
td.best{font-weight:600;color:var(--sienna);background:var(--peach)!important}
.best-chip{background:var(--peach);color:var(--sienna)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field input,.field select{border:1px solid var(--hair);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px}
.chipt{border:1px solid var(--hair);background:var(--paper);border-radius:9999px;padding:7px 14px;cursor:pointer;font-size:13px}
.chipt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;cursor:pointer}
.chk-row input{width:18px;height:18px;accent-color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--slate)}

/* panel y modal */
.scrim{position:fixed;inset:0;background:rgba(23,25,28,.2);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);box-shadow:var(--pop);transform:translateX(105%);transition:.25s;z-index:21;overflow-y:auto;padding:32px;padding-top:calc(32px + env(safe-area-inset-top,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.drawer.on{transform:none}
.drawer h2{font-size:34px;margin:6px 0 4px}
.drawer table td{border-bottom-color:var(--hair)}
.x{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));border:none;background:var(--mist);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.2s;width:min(540px,calc(100% - 32px));background:var(--paper);box-shadow:var(--pop);border-radius:24px;padding:32px;z-index:22}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h2{font-size:36px;margin-top:6px}
.drop{border:1px dashed var(--smoke);border-radius:16px;padding:32px 20px;text-align:center;margin:18px 0;background:var(--fog)}
.drop svg{width:36px;height:36px;stroke:var(--ink);fill:none;stroke-width:1.3;margin-bottom:8px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:9999px;font-size:14px;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.row2,.row2b{grid-template-columns:1fr}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 16px;border-right:none;border-bottom:1px solid var(--hair)}
  .logo{padding-bottom:0}
  .side .foot{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px;margin-top:10px}
  .nav button{width:auto;white-space:nowrap}
  .nav .cnt{display:none}
  .top{padding:24px 16px 16px}
  .content{padding:0 16px 56px}
  .hb{grid-template-columns:96px 1fr 64px}
  .tbl-wrap{overflow-x:auto}
  .mini{grid-template-columns:1fr 1fr}
}

/* nuevas piezas: avisos, prueba, corrección de tickets, bienvenida, plan, privacidad, tu año */
.nav .sep{font-size:12px;color:var(--ash);padding:14px 12px 6px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);cursor:pointer;display:grid;place-items:center;flex:none}
.bell svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9999px;background:var(--sienna);color:var(--paper);font-size:11px;font-weight:500;display:grid;place-items:center;padding:0 5px}
.bell b:empty{display:none}
.trial{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--fog);border:1px solid var(--hair);border-radius:24px;padding:10px 10px 10px 20px;margin-bottom:16px;font-size:14px}
.trial span{flex:1;min-width:220px}
.trial.pe{background:var(--peach);border-color:var(--peach);color:var(--sienna);padding:16px 20px}
.nt{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border:none;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;background:none;text-align:left;font:inherit;color:inherit}
.nt .dt{width:8px;height:8px;border-radius:50%;background:var(--sienna);margin-top:8px;flex:none}
.nt.read .dt{background:transparent}
.nt.read .nm{color:var(--slate)}
.nt .nm{flex:1}
.nt small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.nt .go{color:var(--smoke);font-size:20px;line-height:1}
.ocr{display:block;font-size:11px;color:var(--ash);letter-spacing:.03em;margin-top:2px}
.chip.flag{background:var(--peach);color:var(--sienna)}
.mini-b{border:1px solid var(--hair);background:var(--paper);border-radius:9999px;padding:2px 10px;font-size:12px;cursor:pointer;margin-left:6px}
.edit-in{border:1px solid var(--hair);border-radius:10px;padding:7px 10px;font-size:13px;width:100%;background:var(--paper)}
.edit-in.n{text-align:right;width:82px}
.ln-x{border:none;background:var(--mist);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px}
.rev{background:var(--peach);color:var(--sienna);border-radius:16px;padding:14px 16px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.rev span{flex:1;min-width:200px}
.modal.wide{width:min(620px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow-y:auto}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots i{width:24px;height:4px;border-radius:9999px;background:var(--hair)}
.dots i.on{background:var(--ink)}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--hair);border-radius:16px;padding:16px;cursor:pointer;margin-top:10px;background:var(--paper);text-align:left;width:100%;font:inherit;color:inherit}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:2px}
.opt b{font-weight:500}
.opt small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.ok-list{list-style:none;margin:14px 0}
.ok-list li{padding:9px 0 9px 26px;position:relative;font-size:14px;border-bottom:1px solid var(--hair)}
.card .ok-list li{border-bottom-color:#e4e4e6}
.ok-list li:before{content:'✓';position:absolute;left:2px;color:var(--ink)}
.ob-steps{margin:18px 0 4px}
.ob-steps p{font-size:14px;color:var(--smoke);padding:5px 0}
.ob-steps p.on{color:var(--ink)}
.insight{background:var(--peach);color:var(--sienna);border-radius:20px;padding:22px;margin-top:16px}
.insight .lab{color:var(--sienna)}
.insight .big{font-family:var(--serif);font-size:48px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px}
.ob-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.ob-foot .skip{margin-right:auto}
.modal .mini div{background:var(--mist)}
.skip{border:none;background:none;color:var(--slate);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{background:var(--mist);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:4px}
.plan.cur{background:var(--paper);box-shadow:var(--float)}
.plan h3{font-size:20px}
.plan .pr{font-family:var(--serif);font-size:42px;line-height:1.1;margin:10px 0 0;letter-spacing:-.02em}
.plan ul{list-style:none;margin:12px 0 18px;font-size:14px;color:var(--slate)}
.plan li{padding:4px 0}
.plan .btn{margin-top:auto}
.yr-hero{background:var(--peach);color:var(--sienna);border-radius:28px;padding:36px}
.yr-hero .lab{color:var(--sienna)}
.yr-hero h2{font-size:clamp(36px,4.6vw,60px);margin:10px 0 12px;max-width:20ch}
.yr-hero h2 em{font-style:italic}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.yr .card{padding:24px;min-height:148px;display:flex;flex-direction:column;gap:4px}
.yr .v{font-family:var(--serif);font-size:32px;line-height:1.12;letter-spacing:-.015em;margin:6px 0 2px}
.yr .v em{font-style:italic}
.yr .card.ink{background:var(--ink);color:var(--paper)}
.yr .card.ink .lab,.yr .card.ink .muted{color:var(--smoke)}
@media(max-width:1100px){.plans,.yr{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.plans,.yr{grid-template-columns:1fr}.nav .sep{display:none}}

/* inicio simplificado */
.hero-n{font-family:var(--serif);font-size:52px;line-height:1.05;letter-spacing:-.02em}
.hero-n span{font-family:var(--ui);font-size:16px;color:var(--slate);letter-spacing:0}
.todo{display:flex;gap:14px;align-items:center;width:100%;padding:14px 0;border:none;border-bottom:1px solid #e4e4e6;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.todo:last-child{border-bottom:none}
.todo .nm{flex:1;min-width:0}
.todo small{display:block;font-size:13px;color:var(--slate);margin-top:2px}
.todo .chip{min-width:66px;text-align:center}
.todo .go{color:var(--smoke);font-size:20px}
.todo:hover .nm{text-decoration:underline;text-underline-offset:3px}
.mini .up-g,.mini .up-r,.mini .up-n{margin-top:4px}
</style>
<div class="shell">
  <aside class="side">
    <div class="logo">the grocery <em>report</em></div>
    <nav class="nav" id="nav">
      <button data-v="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 9.5V20h14V9.5"/></svg>Inicio</button>
      <button data-v="objetivos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>Objetivos</button>
      <button data-v="ahorro"><svg viewBox="0 0 24 24"><path d="M18 6.5A7 7 0 1 0 18 17.5M4 10h10M4 14h10"/></svg>Ahorro</button>
      <button data-v="anual"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Tu año</button>
      <button data-v="tickets"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6M9 12h6"/></svg>Tickets<span class="cnt" id="cntT"></span></button>
      <button data-v="productos"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Productos y precios</button>
      <button data-v="precios"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Comparar precios</button>
      <button data-v="categorias"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Categorías</button>
      <button data-v="cesta"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8.5l3 7.5M16 8.5l-3 7.5M8.5 7h7"/></svg>La cesta</button>
      <button data-v="lista"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 12h-11zM9 7V5a3 3 0 016 0v2"/></svg>Lista de la compra<span class="cnt" id="cntL"></span></button>
      <div class="sep">Cuenta</div>
      <button data-v="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Perfil</button>

<script>
/* ---------- utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(11);
const num=(n,d=2)=>{let s=Math.abs(n).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'−':'')+s.join(',')};

const DAY=864e5;
const fd=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2);

const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+1)%7));return x}; // semanas de sábado a viernes
function delta(v,goodDown=true){
  if(!isFinite(v))return '<span class="up-n">—</span>';
  if(Math.abs(v)<.005)return '<span class="up-n">= 0 %</span>';
  const up=v>0,good=goodDown?!up:up;

}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- datos de ejemplo ---------- */
const STORES={A:'Mercadona',B:'Carrefour',F:'Frutería'};
const SF={A:1,B:1.06,F:.95};
const CATS=['Fruta','Verdura','Carne','Pescado','Lácteos','Huevos','Panadería','Despensa','Bebidas','Congelados','Limpieza','Higiene'];
// [nombre, categoría, precio, kg?, prob. compra grande, prob. compra pequeña, prob. frutería, tendencia]
const RAW=[

['Café molido','Despensa',3.60,0,.2,.05,0,.06],
['Agua mineral 6x1,5 L','Bebidas',2.40,0,.5,.15,0,0],

const P=RAW.map((r,i)=>({id:i,name:r[0],cat:r[1],price:r[2],kg:!!r[3],pb:r[4],ps:r[5],pf:r[6],trend:r[7]}));
const byName=n=>P.find(p=>p.name===n).id;
const CHAINS=['Mercadona','Carrefour','Lidl','Dia','Alcampo','Eroski'];
// precio de hoy en cada cadena (EJEMPLO: en la app real se leería de sus webs y apps)
function catalog(p){const r=mulberry32(1000+p.id*7);return CHAINS.map(c=>({c,pu:Math.round(p.price*(1+p.trend)*(1+(r()-.5)*.14)*100)/100})).sort((a,b)=>a.pu-b.pu)}
const START=new Date(2026,7,1), TODAY=new Date(2026,9,29);
function priceOf(p,st,d){
  let tr=p.trend; if(p.name.startsWith('Aceite')&&st==='B')tr=.14;
  const t=(d-START)/(TODAY-START);
  return Math.round(p.price*SF[st]*(1+tr*t)*(1+(R()-.5)*.03)*100)/100;
}
let TID=1;
function makeTicket(st,d,big){
  const ids=new Set();
  P.forEach(p=>{const pr=st==='F'?p.pf:(big?p.pb:p.ps);if(R()<pr)ids.add(p.id)});
  if(st!=='F'){
    const pairs=[['Pan de molde integral','Tomate rama',.6],['Barra de pan','Jamón serrano lonchas',.45],['Pasta espagueti','Tomate frito',.75],['Leche semidesnatada x6','Cereales',.3],['Yogur natural x8','Plátano canario',.45]];
    pairs.forEach(([a,b,pr])=>{if(ids.has(byName(a))&&R()<pr)ids.add(byName(b))});
  }
  if(ids.size<2){const pool=P.filter(p=>st==='F'?p.pf>0:true);while(ids.size<2)ids.add(pool[Math.floor(R()*pool.length)].id)}
  const lines=[...ids].map(id=>{const p=P[id];const q=p.kg?Math.round((.6+R()*1.2)*1000)/1000:(R()<.15?2:1);const pu=priceOf(p,st,d);return{pid:id,qty:q,pu,total:Math.round(q*pu*100)/100}});
  const date=new Date(d);date.setHours(9+Math.floor(R()*11),Math.floor(R()*60));
  return{id:TID++,date,store:st,lines,total:Math.round(lines.reduce((s,l)=>s+l.total,0)*100)/100};
}
let T=[];
for(let d=new Date(START);d<=TODAY;d=new Date(d.getTime()+DAY)){
  const w=d.getDay();
  if(w===6&&R()<.92)T.push(makeTicket('A',d,true));
  if(w===3&&R()<.6)T.push(makeTicket('B',d,false));
  if(w===1&&R()<.25)T.push(makeTicket('B',d,false));
  if((w===2||w===5)&&R()<.4)T.push(makeTicket('F',d,false));
}
T.sort((a,b)=>b.date-a.date);

/* ---------- cálculos ---------- */
const inMonth=(t,m)=>t.date.getMonth()===m&&t.date.getFullYear()===2026;
const sum=a=>a.reduce((s,x)=>s+x,0);
function weekly(n=12){
  const cur=wk(TODAY),out=[];
  for(let i=n-1;i>=0;i--){const s=new Date(cur.getTime()-i*7*DAY),e=new Date(s.getTime()+7*DAY);out.push({s,v:sum(T.filter(t=>t.date>=s&&t.date<e).map(t=>t.total))})}
  return out;
}
function catSpend(filter){const m={};CATS.forEach(c=>m[c]=0);T.filter(filter).forEach(t=>t.lines.forEach(l=>m[P[l.pid].cat]+=l.total));return m}
function productStats(){
  return P.map(p=>{
    const buys=T.filter(t=>t.lines.some(l=>l.pid===p.id)).sort((a,b)=>a.date-b.date);
    const lines=buys.map(t=>({d:t.date,st:t.store,...t.lines.find(l=>l.pid===p.id)}));
    const gaps=[];for(let i=1;i<buys.length;i++)gaps.push((buys[i].date-buys[i-1].date)/DAY);
    const every=gaps.length?sum(gaps)/gaps.length:NaN;
    const first=lines.slice(0,3),last=lines.slice(-3);
    const avg=a=>a.length?sum(a.map(x=>x.pu/SF[x.st]))/a.length:NaN;
    const varp=lines.length>=4?avg(last)/avg(first)-1:NaN;
    const lastD=buys.length?buys[buys.length-1].date:null;
    const since=lastD?(TODAY-lastD)/DAY:NaN;
    return{p,n:buys.length,every,varp,lastD,since,lastPu:lines.length?lines[lines.length-1].pu:NaN,lines,spend:sum(lines.map(l=>l.total))};
  });
}
function rules(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,c={},cc={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))];ids.forEach(a=>c[a]=(c[a]||0)+1);
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);cc[k]=(cc[k]||0)+1}});
  return Object.entries(cc).filter(([k,v])=>v>=4).map(([k,v])=>{const[a,b]=k.split('-').map(Number);
    const lift=(v/N)/((c[a]/N)*(c[b]/N));const[x,y]=c[a]<=c[b]?[a,b]:[b,a];
    return{a:x,b:y,sup:v/N,conf:v/c[x],lift,n:v}}).sort((a,b)=>b.lift-a.lift).slice(0,10);
}

/* ---------- gráficos SVG ---------- */
function barChart(data,hiFrom){
  const W=640,H=220,pl=44,pb=26,pt=10,max=Math.max(...data.map(d=>d.v))*1.1||1,bw=(W-pl)/data.length;
  let g='';for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*i/4,v=max*(1-i/4);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#ececec"/><text x="${pl-8}" y="${y+4}" font-size="10" fill="#777b86" text-anchor="end">${num(v,0)}</text>`}
  data.forEach((d,i)=>{const h=(H-pt-pb)*d.v/max,x=pl+i*bw+bw*.18,y=H-pb-h,hi=i>=hiFrom;
    g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="4" fill="${hi?'#17191c':'#d9dadd'}" stroke="none"><title>Semana del ${fdm(d.s)} · ${eur(d.v)}</title></rect>`;
    if(i%2===data.length%2||data.length<8)g+=`<text x="${x+bw*.32}" y="${H-8}" font-size="10" fill="#777b86" text-anchor="middle">${fdm(d.s)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto semanal">${g}</svg>`;
}
function lineChart(series){
  const W=460,H=200,pl=46,pr=10,pt=12,pb=26;const pts=series.flatMap(s=>s.pts);if(!pts.length)return '<div class="empty">Sin datos</div>';
  const x0=START.getTime(),x1=TODAY.getTime();let y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));const pad=(y1-y0)*.25||y1*.1;y0-=pad;y1+=pad;
  const X=t=>pl+(W-pl-pr)*(t-x0)/(x1-x0),Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0));
  let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ececec"/><text x="${pl-8}" y="${y+4}" font-size="10" fill="#777b86" text-anchor="end">${num(v)}</text>`}
  [7,8,9].forEach(m=>{const t=new Date(2026,m,1).getTime(),x=X(t);g+=`<text x="${x+4}" y="${H-8}" font-size="10" fill="#777b86">${MES[m].slice(0,3).toUpperCase()}</text>`});
  series.forEach(s=>{if(!s.pts.length)return;const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');
    g+=`<path d="${d}" fill="none" stroke="none" stroke-width="4.5"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="3"/>`+s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${s.c}" stroke="none"><title>${fd(new Date(p[0]))} · ${eur(p[1])}</title></circle>`).join('')});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del precio">${g}</svg>`;
}

/* ---------- red de productos (co-compra) ---------- */
function pairStats(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,c={},cc={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))];ids.forEach(a=>c[a]=(c[a]||0)+1);
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);cc[k]=(cc[k]||0)+1}});
  const all=Object.entries(cc).map(([k,v])=>{const[a,b]=k.split('-').map(Number);return{a,b,n:v,sup:v/N,lift:(v/N)/((c[a]/N)*(c[b]/N))}});
  return{N,c,all};
}
let netSel=null,netMin=1.2;
function netData(){
  const st=pairStats();
  const edges=st.all.filter(r=>r.n>=5&&r.lift>=netMin).sort((x,y)=>y.lift*Math.sqrt(y.n)-x.lift*Math.sqrt(x.n)).slice(0,18);
  const ids=[...new Set(edges.flatMap(r=>[r.a,r.b]))];
  const deg={};edges.forEach(r=>{deg[r.a]=(deg[r.a]||0)+1;deg[r.b]=(deg[r.b]||0)+1});
  if(netSel===null||!ids.includes(netSel))netSel=ids.slice().sort((x,y)=>(deg[y]||0)-(deg[x]||0)||st.c[y]-st.c[x])[0];
  return{...st,edges,ids,deg};
}
const NETPOS={};
function netLayout(d,W,H){
  const key=W+'x'+H+':'+d.edges.map(e=>e.a+'-'+e.b).join(',');if(NETPOS[key])return NETPOS[key];
  const n=d.ids.length,pos={},k=Math.sqrt(W*H/Math.max(n,1))*.8;
  d.ids.forEach((id,i)=>{const a=i*2.399963;const r=Math.sqrt((i+.5)/n)*Math.min(W,H)*.42;pos[id]={x:W/2+r*Math.cos(a),y:H/2+r*Math.sin(a)}});
  const padX=Math.min(70,W*.17),padY=28;
  for(let it=0;it<400;it++){
    const t=k*.12*(1-it/400)+.5,disp={};d.ids.forEach(id=>disp[id]={x:0,y:0});
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=pos[d.ids[i]],B=pos[d.ids[j]];let dx=A.x-B.x,dy=(A.y-B.y)*1.6;let dist=Math.hypot(dx,dy)||.01;const f=k*k/dist;dx/=dist;dy/=dist;
      disp[d.ids[i]].x+=dx*f;disp[d.ids[i]].y+=dy*f;disp[d.ids[j]].x-=dx*f;disp[d.ids[j]].y-=dy*f}
    d.edges.forEach(e=>{const A=pos[e.a],B=pos[e.b];let dx=A.x-B.x,dy=A.y-B.y;const dist=Math.hypot(dx,dy)||.01;const f=dist*dist/k*(.6+e.lift*.25);dx/=dist;dy/=dist;
      disp[e.a].x-=dx*f;disp[e.a].y-=dy*f;disp[e.b].x+=dx*f;disp[e.b].y+=dy*f});
    d.ids.forEach(id=>{const p=pos[id],q=disp[id];q.x+=(W/2-p.x)*.35;q.y+=(H/2-p.y)*.6;const L=Math.hypot(q.x,q.y)||1;
      p.x=Math.min(W-padX,Math.max(padX,p.x+q.x/L*Math.min(L,t)));p.y=Math.min(H-padY,Math.max(padY,p.y+q.y/L*Math.min(L,t)))});
  }
  const xs=d.ids.map(i=>pos[i].x),ys=d.ids.map(i=>pos[i].y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*padX)/((x1-x0)||1),(H-2*padY-30)/((y1-y0)||1)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
  d.ids.forEach(i=>{pos[i].x=ox+(pos[i].x-x0)*sc;pos[i].y=oy+(pos[i].y-y0)*sc});
  return NETPOS[key]=pos;
}
const shortName=nm=>{let w=nm.replace(/ x\d+.*$/,'').replace(/ \d.*$/,'').split(' ');while(w.join(' ').length>20&&w.length>1)w.pop();while(w.length>1&&['de','del','la','en','y'].includes(w[w.length-1]))w.pop();return w.join(' ')};
function netSVG(d,W,H){
  if(!d.ids.length)return '<p class="muted" style="padding:40px 0;text-align:center">No hay parejas con esa fuerza. Baja el filtro.</p>';
  const pos=netLayout(d,W,H),sel=netSel,maxL=Math.max(...d.edges.map(e=>e.lift)),minL=Math.min(...d.edges.map(e=>e.lift));
  const nb=new Set(d.edges.filter(e=>e.a===sel||e.b===sel).flatMap(e=>[e.a,e.b]));
  const rr=id=>6+15*Math.sqrt(d.c[id]/d.N);
  let g='';
  d.edges.slice().sort((x,y)=>((x.a===sel||x.b===sel)?1:0)-((y.a===sel||y.b===sel)?1:0)).forEach(e=>{const on=e.a===sel||e.b===sel,A=pos[e.a],B=pos[e.b],w=1.2+4.5*(e.lift-minL)/((maxL-minL)||1);
    g+=`<line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="${on?'#5d2a1a':'#a3a6af'}" stroke-opacity="${on?.9:.35}" stroke-width="${w.toFixed(1)}" stroke-linecap="round"><title>${esc(P[e.a].name)} + ${esc(P[e.b].name)} · ${e.n} veces juntos · ${num(e.lift,1)}×</title></line>`});
  d.ids.forEach(id=>{const p=pos[id],r=rr(id),isSel=id===sel,isNb=nb.has(id)&&!isSel,dim=!isSel&&!isNb;
    const below=p.y<H-40;
    g+=`<g data-node="${id}" style="cursor:pointer" opacity="${dim?.8:1}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r+8).toFixed(1)}" fill="transparent"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${isSel?'#5d2a1a':isNb?'#17191c':'#ffffff'}" stroke="${isSel?'#5d2a1a':isNb?'#17191c':'#a3a6af'}" stroke-width="1.5"/>
    <text x="${p.x.toFixed(1)}" y="${(below?p.y+r+14:p.y-r-7).toFixed(1)}" font-size="${isSel?12.5:11.5}" font-weight="${isSel?600:400}" fill="${isSel?'#5d2a1a':dim?'#777b86':'#17191c'}" text-anchor="middle" style="paint-order:stroke;stroke:#f2f2f3;stroke-width:4px;stroke-linejoin:round">${esc(shortName(P[id].name))}</text><title>${esc(P[id].name)} · en ${num(d.c[id]/d.N*100,0)} % de tus compras</title></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Red de productos que compras juntos" style="display:block;touch-action:manipulation">${g}</svg>`;
}
function netPartners(d,id,k=5){
  return d.all.filter(e=>(e.a===id||e.b===id)&&e.n>=3&&e.lift>1).map(e=>({o:e.a===id?e.b:e.a,n:e.n,conf:e.n/d.c[id],lift:e.lift})).sort((x,y)=>y.conf*y.lift-x.conf*x.lift).slice(0,k);
}
const NETFILT=[[1.2,'Todas'],[1.5,'Fuertes'],[1.8,'Muy fuertes']];

V.inicio=()=>{
  const oct=T.filter(t=>inMonth(t,9)),sep=T.filter(t=>inMonth(t,8)),so=sum(oct.map(t=>t.total)),ss=sum(sep.map(t=>t.total));
  const w=weekly(13),bAvg=sum(w.slice(0,8).map(x=>x.v))/8,target=bAvg-GOAL,cw=w[w.length-1],left=target-cw.v;
  const wa=sum(w.slice(-5,-1).map(x=>x.v))/4,tmO=so/oct.length,tmS=ss/sep.length;
  const ps=productStats();
  let al=null;P.forEach(p=>['A','B'].forEach(st=>{const L=ps[p.id].lines.filter(l=>l.st===st);const a=L.filter(l=>l.d-START<35*DAY),b=L.filter(l=>TODAY-l.d<35*DAY);
    if(a.length&&b.length){const v=sum(b.map(x=>x.pu))/b.length/(sum(a.map(x=>x.pu))/a.length)-1;if(!al||v>al.v)al={p,st,v,now:b[b.length-1].pu}}}));
  const rr=recs(),save=sum(rr.map(r=>r.save)),rev=T.find(t=>flagged(t).length),li=listItems().filter(s=>!done.has(s.p.id)).length;
  const todo=[];
  if(al)todo.push(['Sube',`${al.p.name} +${num(al.v*100,0)} %`,`En ${STORES[al.st]} desde agosto · ahora ${eur(al.now)}`,`data-p="${al.p.id}"`,1]);
  if(rr.length)todo.push(['Ahorra',`Puedes ahorrar ${eur(save)} al mes`,`${rr.length} cambios fáciles de súper o de producto`,'data-go="ahorro"',0]);
  if(rev)todo.push(['Revisa',`${flagged(rev).length} ${flagged(rev).length>1?'líneas':'línea'} por revisar`,`Ticket de ${STORES[rev.store]} del ${fdm(rev.date)}`,`data-t="${rev.id}"`,1]);
  todo.push(['Lista',`${li} productos para el sábado`,'Tu lista ya está hecha con tu ritmo de compra','data-go="lista"',0]);
  return `
  <div class="row2" style="margin-top:0">
    <div class="card pn"><div class="pn-h"><h3>Esta semana</h3><span class="lab">${fdm(cw.s)} – ${fdm(new Date(cw.s.getTime()+6*DAY))}</span></div>
      <div class="hero-n">${eur(cw.v)} <span>de ${eur(target)}</span></div>
      <div class="prog" style="height:10px;margin-top:12px"><i style="width:${Math.min(100,cw.v/target*100)}%;${left<0?'background:var(--ko)':''}"></i></div>
      <div>${left>=0?`<span class="up-g">Te quedan ${eur(left)} hasta el viernes</span>`:`<span class="up-r">Te has pasado ${eur(-left)}</span>`} <span class="muted" style="font-size:13px">· meta: bajar ${GOAL} € a la semana</span></div>
      <div style="margin-top:22px">${barChart(weekly(12),8)}</div>
      <div class="pn-h" style="margin:8px 0 0"><span class="note" style="margin:0">Gasto por semana · negro: últimas 4</span><button class="btn s" data-go="objetivos">Ver mi meta</button></div></div>
    <div class="card pn"><div class="pn-h"><h3>Para hoy</h3><span class="lab">${todo.length} cosas</span></div>
      ${todo.map(x=>`<button class="todo" ${x[3]}><span class="chip ${x[4]?'flag':''}">${x[0]}</span><span class="nm">${esc(x[1])}<small>${esc(x[2])}</small></span><span class="go" aria-hidden="true">›</span></button>`).join('')}</div>
  </div>
  <div class="row2b">
    <div class="card pn"><div class="pn-h"><h3>Octubre</h3><button class="btn s" data-go="categorias">Ver en qué se va</button></div>
      <div class="mini" style="margin:0">
        <div><span class="lab">Gasto</span><span class="num">${eur(so)}</span>${delta(so/ss-1)}</div>
        <div><span class="lab">Media semanal</span><span class="num">${eur(wa)}</span><span class="muted" style="font-size:12px">últimas 4 sem.</span></div>
        <div><span class="lab">Ticket medio</span><span class="num">${eur(tmO)}</span>${delta(tmO/tmS-1)}</div>
      </div></div>
    <div class="card pn"><div class="pn-h"><h3>Últimos tickets</h3><button class="btn s" data-go="tickets">Ver todos</button></div>
      <table><tbody>${T.slice(0,3).map(t=>`<tr class="click" data-t="${t.id}"><td>${DIA[t.date.getDay()]} ${fdm(t.date)}</td><td>${STORES[t.store]}</td><td class="n">${eur(t.total)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
};

let tFilter='all',tq='';
V.tickets=()=>{
  const rows=T.filter(t=>tFilter==='all'||t.store===tFilter).filter(t=>!tq||t.lines.some(l=>P[l.pid].name.toLowerCase().includes(tq)));
  return `<div class="tools"><input id="tq" placeholder="Buscar un producto en los tickets…" value="${esc(tq)}">
    <div class="seg" id="tseg">${[['all','Todas'],['A','Mercadona'],['B','Carrefour'],['F','Frutería']].map(([k,l])=>`<button data-k="${k}" class="${tFilter===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card pn"><div class="pn-h"><h3>${rows.length} tickets</h3><span class="num">${eur(sum(rows.map(t=>t.total)))}</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Tienda</th><th>Origen</th><th class="n">Líneas</th><th class="n">Total</th></tr></thead><tbody>
  ${rows.map(t=>`<tr class="click" data-t="${t.id}"><td>${DIA[t.date.getDay()]} ${fd(t.date)} <span class="muted">${String(t.date.getHours()).padStart(2,'0')}:${String(t.date.getMinutes()).padStart(2,'0')}</span></td><td>${STORES[t.store]}</td><td><span class="chip">${t.src||(t.store==='F'||t.id%4===0?'Foto':'Gmail')}</span></td><td class="n">${t.lines.length}</td><td class="n">${eur(t.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Ningún ticket coincide</td></tr>'}
  </tbody></table></div></div>`;
};

let pq='',pcat='',psort='n';
V.productos=()=>{
  let ps=productStats().filter(s=>s.n>0).filter(s=>!pq||s.p.name.toLowerCase().includes(pq)).filter(s=>!pcat||s.p.cat===pcat);
  ps.sort((a,b)=>psort==='var'?(b.varp||-9)-(a.varp||-9):psort==='spend'?b.spend-a.spend:b.n-a.n);
  return `<div class="tools"><input id="pq" placeholder="Buscar producto…" value="${esc(pq)}">
    <select id="pcat"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${pcat===c?'selected':''}>${c}</option>`).join('')}</select>
    <div class="seg" id="psort">${[['n','Más comprados'],['spend','Más gasto'],['var','Más subida']].map(([k,l])=>`<button data-k="${k}" class="${psort===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card pn"><div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="n">Veces</th><th class="n">Cada</th><th class="n">Último precio</th><th class="n">Variación</th><th class="n">Gasto</th></tr></thead><tbody>
  ${ps.map(s=>`<tr class="click" data-p="${s.p.id}"><td>${esc(s.p.name)}</td><td><span class="chip">${s.p.cat}</span></td><td class="n">${s.n}</td><td class="n">${isFinite(s.every)?num(s.every,0)+' días':'—'}</td><td class="n">${eur(s.lastPu)}${s.p.kg?'/kg':''}</td><td class="n">${delta(s.varp)}</td><td class="n">${eur(s.spend)}</td></tr>`).join('')}
  </tbody></table></div><div class="note">Variación: precio de las 3 últimas compras frente a las 3 primeras, por tienda</div></div>`;
};

let selCat=null;
V.categorias=()=>{
  const co=catSpend(t=>inMonth(t,9)),cs=catSpend(t=>inMonth(t,8)),ca=catSpend(t=>inMonth(t,7));
  const tot=sum(Object.values(co));const cats=CATS.map(c=>({c,v:co[c],p:cs[c],a:ca[c]})).sort((a,b)=>b.v-a.v);
  selCat=selCat||cats[0].c;const mx=Math.max(...cats.map(c=>Math.max(c.v,c.p)));
  const ps=productStats().filter(s=>s.p.cat===selCat&&s.n>0).map(s=>({...s,o:sum(s.lines.filter(l=>l.d.getMonth()===9).map(l=>l.total))})).sort((a,b)=>b.o-a.o);
  return `<div class="row2" style="margin-top:0">
    <div class="card pn"><div class="pn-h"><h3>Octubre frente a septiembre</h3><span class="lab">Pulsa una categoría</span></div>
      ${cats.map(c=>`<div class="hb" data-cat="${c.c}" style="${c.c===selCat?'font-weight:600':''}"><span>${c.c===selCat?'<span class="b">● </span>':''}${c.c}</span><div class="tr"><i style="width:${c.v/mx*100}%"></i><i class="g" style="width:${c.p/mx*100}%"></i></div><span class="num">${num(c.v/tot*100,0)} %</span></div>`).join('')}
      <div class="note">Barra azul: octubre · Línea gris: septiembre</div></div>
    <div class="card pn"><div class="eyebrow">Categoría</div><h3 style="font-size:24px;margin:6px 0 4px">${selCat}</h3>
      <div class="mini">${[['Agosto',ca[selCat]],['Septiembre',cs[selCat]],['Octubre',co[selCat]]].map(([l,v])=>`<div><span class="lab">${l}</span><span class="num">${eur(v)}</span></div>`).join('')}</div>
      <div class="d num" style="font-size:12px;margin-bottom:14px">${delta(co[selCat]/cs[selCat]-1)} <span class="muted">vs. septiembre</span></div>
      <table><thead><tr><th>Producto</th><th class="n">Octubre</th></tr></thead><tbody>${ps.map(s=>`<tr class="click" data-p="${s.p.id}"><td>${esc(s.p.name)}</td><td class="n">${eur(s.o)}</td></tr>`).join('')}</tbody></table>
    </div></div>`;
};

  const rs=rules(),bk=baskets(),d=netData(),sel=netSel,pt=sel!=null?netPartners(d,sel):[];
  return `<div class="row2" style="margin-top:0">
   <div class="card pn"><div class="pn-h"><h3>Red de productos</h3><div class="seg">${NETFILT.map(([v,l])=>`<button data-nm="${v}" class="${netMin===v?'on':''}">${l}</button>`).join('')}</div></div>
    ${netSVG(d,640,440)}
    <div class="note">Cada círculo es un producto: cuanto más grande, en más compras aparece. Las líneas unen lo que compras junto más de lo normal; cuanto más gruesa, más relación. Toca un producto para verlo.</div></div>

    <div class="note" style="margin-top:24px">El % es la confianza: si compras uno, cuántas veces va el otro. El número con × es el lift: cuántas veces más van juntos de lo que tocaría por azar.</div></div>

   <div class="row2b" style="margin-top:0">${[['De 3 productos',bk.b3],['De 4 productos',bk.b4]].map(([l,a])=>`<div style="min-width:0"><span class="lab">${l}</span>${a.map(o=>`<div class="list-item"><span class="nm">${o.ids.map(i=>esc(P[i].name)).join(' + ')}</span><span class="num b">${num(o.sup*100,0)} %</span></div>`).join('')}</div>`).join('')}</div>

  <div class="tbl-wrap"><table><thead><tr><th>Si compras…</th><th>…también te llevas</th><th class="n">Veces juntos</th><th class="n">Soporte</th><th class="n">Confianza</th><th class="n">Lift</th></tr></thead><tbody>
  ${rs.map(r=>`<tr><td>${esc(P[r.a].name)}</td><td>${esc(P[r.b].name)}</td><td class="n">${r.n}</td><td class="n">${num(r.sup*100,0)} %</td><td class="n">${num(r.conf*100,0)} %</td><td class="n b">${num(r.lift,1)}×</td></tr>`).join('')}
  </tbody></table></div></div>`;

const done=new Set();
function listItems(){return productStats().filter(s=>s.n>=3&&isFinite(s.every)).map(s=>({...s,due:s.since/s.every})).filter(s=>s.due>=.8).sort((a,b)=>b.due-a.due)}
V.lista=()=>{
  const it=listItems(),ids=new Set(it.map(s=>s.p.id));
  const sug=rules().filter(r=>ids.has(r.a)&&!ids.has(r.b)).slice(0,3);
  const est=sum(it.filter(s=>!done.has(s.p.id)).map(s=>s.lines.length?s.lines[s.lines.length-1].total:0));
  return `<div class="row2" style="margin-top:0">
    <div class="card pn"><div class="pn-h"><h3>${it.length} productos para esta semana</h3><span class="lab">Según tu ritmo de compra</span></div>
      ${it.map(s=>`<label class="list-item ${done.has(s.p.id)?'done':''}"><input type="checkbox" data-l="${s.p.id}" ${done.has(s.p.id)?'checked':''}><span class="nm">${esc(s.p.name)}<br><span class="muted" style="font-size:12px">Lo compras cada ${num(s.every,0)} días · última vez hace ${num(s.since,0)}</span></span><div class="bar-due" title="${num(s.due*100,0)} % del intervalo"><i style="width:${Math.min(100,s.due*100)}%"></i></div></label>`).join('')}
    </div>
    <div>
      <div class="card pn"><span class="lab">Coste estimado</span><div class="num b" style="font-size:36px;margin:6px 0">${eur(est)}</div><span class="muted" style="font-size:12px">Con el último precio que pagaste de cada producto. La app no compra por ti: marca tú lo que te llevas.</span>
        <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn" id="share">Compartir lista</button><button class="btn g" id="clear">Desmarcar todo</button></div></div>
      <div class="card pn" style="margin-top:16px"><div class="pn-h"><h3>Suelen ir juntos</h3></div>
        ${sug.length?sug.map(r=>`<div class="list-item"><span class="nm">${esc(P[r.b].name)}<br><span class="muted" style="font-size:12px">Con ${esc(P[r.a].name.toLowerCase())} · lift ${num(r.lift,1)}×</span></span><span class="chip">Sugerido</span></div>`).join(''):'<p class="muted">Sin sugerencias esta semana.</p>'}</div>
    </div></div>`;
};

/* ---------- comparador de precios ---------- */
let cq='',ccat='';
V.precios=()=>{
  const rows=P.filter(p=>(!cq||p.name.toLowerCase().includes(cq))&&(!ccat||p.cat===ccat)).map(p=>{const c=catalog(p),by={};c.forEach(x=>by[x.c]=x.pu);return{p,by,min:c[0].pu,max:c[c.length-1].pu,best:c[0].c}});
  const saving=sum(rows.map(r=>r.max-r.min));
  return `<div class="tools"><input id="cq" placeholder="Busca un producto…" value="${esc(cq)}"><select id="ccat"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${ccat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="card pn"><div class="pn-h"><h3>Precio hoy en cada supermercado</h3><span class="lab">${CHAINS.length} cadenas · actualizado hoy a las 08:00 · precios de ejemplo</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Producto</th>${CHAINS.map(c=>`<th class="n">${c}</th>`).join('')}<th class="n">Diferencia</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click" data-p="${r.p.id}"><td>${esc(r.p.name)}${r.p.kg?' <span class="muted">/kg</span>':''}</td>${CHAINS.map(c=>`<td class="n${c===r.best?' best':''}">${eur(r.by[c])}</td>`).join('')}<td class="n">${eur(r.max-r.min)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Ningún producto coincide</td></tr>'}
  </tbody></table></div>

/* ---------- cestas de 3 y 4 productos ---------- */
function baskets(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,cnt={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))].sort((a,b)=>a-b);
    const rec=(st,k,cur)=>{if(cur.length===k){const key=cur.join('-');cnt[key]=(cnt[key]||0)+1;return}for(let i=st;i<ids.length;i++){cur.push(ids[i]);rec(i+1,k,cur);cur.pop()}};
    rec(0,3,[]);rec(0,4,[]);});
  const out=Object.entries(cnt).map(([k,v])=>({ids:k.split('-').map(Number),n:v,sup:v/N}));
  const pick=k=>out.filter(o=>o.ids.length===k).sort((a,b)=>b.n-a.n).slice(0,4);
  return{N,b3:pick(3),b4:pick(4)};
}

const ALT={'Café molido':['Café molido marca del súper',.78],'Yogur natural x8':['Yogur natural marca del súper x8',.8],'Zumo de naranja':['Zumo de naranja marca del súper',.75],'Jamón serrano lonchas':['Jamón serrano en taco',.82],'Detergente':['Detergente marca del súper',.7],'Cereales':['Cereales marca del súper',.72]};
function recs(){
  const ps=productStats(),M=(TODAY-START)/DAY/30.4,out=[];
  ps.forEach(s=>{const la={};s.lines.forEach(l=>{if(l.st!=='F')la[l.st]=l});
    if(la.A&&la.B){const[hi,lo]=la.A.pu>la.B.pu?['A','B']:['B','A'];const d=la[hi].pu-la[lo].pu;
      if(d/la[hi].pu>.03){const q=sum(s.lines.filter(l=>l.st===hi).map(l=>l.qty))/M;out.push({type:'store',p:s.p,to:lo,pf:la[hi].pu,pt:la[lo].pu,save:d*q})}}
    const alt=ALT[s.p.name];if(alt&&s.n)out.push({type:'alt',p:s.p,alt:alt[0],pf:s.lastPu,pt:s.lastPu*alt[1],save:s.spend/M*(1-alt[1])});
  });
  return out.filter(r=>r.save>=.3).sort((a,b)=>b.save-a.save);
}

  modal.innerHTML=`<div class="eyebrow">Nuevo ticket</div><h2 style="font-size:24px;margin-top:6px">Sube tu <span class="b">ticket</span></h2>
  <div class="seg" id="useg" style="margin-top:18px">${[['foto','Foto'],['correo','Gmail']].map(([k,l])=>`<button data-k="${k}" class="${upMode===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="drop" id="drop">${upMode==='correo'?`<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><div><b>Gmail conectado</b></div><div class="num b" style="margin-top:6px">Filtro: asunto contiene «ticket»</div><div class="muted" style="font-size:12px;margin-top:6px">Solo leemos esos correos. Los tickets nuevos se añaden solos.</div>`
  :`<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg><div><b>Haz una foto o arrastra aquí la imagen</b></div><div class="muted" style="font-size:12px">Que se vea el ticket entero, de arriba abajo</div>`}</div>
  <div id="upst" class="muted" style="font-size:12px;min-height:20px"></div><div class="prog"><i id="upbar"></i></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn g" id="ucancel">Cancelar</button><button class="btn" id="ugo">${upMode==='correo'?'Buscar tickets nuevos':'Leer ticket'}</button></div>`;
  modal.classList.add('on');scrim.classList.add('on');
  modal.querySelectorAll('#useg button').forEach(b=>b.onclick=()=>{upMode=b.dataset.k;openUpload()});
  document.getElementById('ucancel').onclick=closeAll;
  document.getElementById('ugo').onclick=runUpload;
}
function runUpload(){
  const steps=[upMode==='correo'?'Buscando correos con «ticket» en el asunto…':'Leyendo la foto con IA…','Detectando líneas de producto…','Clasificando por categoría…','Listo'],bar=document.getElementById('upbar'),st=document.getElementById('upst');
  document.getElementById('ugo').disabled=true;
  steps.forEach((s,i)=>setTimeout(()=>{st.textContent=s;bar.style.width=((i+1)/steps.length*100)+'%';
    if(i===steps.length-1)setTimeout(()=>{const t=makeTicket('A',TODAY,true);t.src=upMode==='foto'?'Foto':'Gmail';t.date=new Date();t.date.setFullYear(2026,9,29);T.unshift(t);FLAG.add(fkey(t,t.lines[Math.min(1,t.lines.length-1)].pid));closeAll();render();toast(`Ticket añadido · ${t.lines.length} líneas · ${eur(t.total)}`);setTimeout(()=>openTicket(t.id),350)},400)},i*650));
}
document.getElementById('upBtn').onclick=openUpload;
document.getElementById('bellBtn').onclick=openAvisos;

/* ---------- navegación ---------- */
let cur='inicio';
function render(){
  document.getElementById('eyebrow').textContent=titles[cur][0];document.getElementById('title').innerHTML=titles[cur][1];
  document.getElementById('view').innerHTML=V[cur]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===cur));
  document.getElementById('cntT').textContent=T.length;updateBell();document.getElementById('cntL').textContent=listItems().filter(s=>!done.has(s.p.id)).length;
}
function go(v){cur=v;render();window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
const view=document.getElementById('view');
view.addEventListener('click',e=>{
  const pl=e.target.closest('[data-plan]');if(pl){planSel=pl.dataset.plan;render();return toast(planSel==='familia'?'Sigues en el plan Familia':`Al terminar la prueba pasarás al plan ${PLANS.find(x=>x[0]===planSel)[1]}`)}
  const cy=e.target.closest('[data-cy]');if(cy){cycle=cy.dataset.cy;return render()}
  if(e.target.dataset.priv){PRIV[e.target.dataset.priv]=e.target.checked;render();return toast('Permiso actualizado')}
  if(e.target.id==='discGmail'){PRIV.gmail=!PRIV.gmail;render();return toast(PRIV.gmail?'Gmail conectado':'Gmail desconectado · ya no leemos tu correo')}
  if(e.target.id==='delPhotos')return toast('Fotos borradas · tus tickets se quedan');
  if(e.target.id==='payBtn')return toast('En la app real se abre el pago de la tienda de apps');
  if(e.target.id==='deleteBtn')return openDelete();
  if(e.target.id==='obAgain')return openOb();
  if(e.target.id==='shareYr')return toast(hideAmt?'Imagen lista, sin importes':'Imagen lista para compartir');
  if(e.target.id==='hideAmt'){hideAmt=e.target.checked;return render()}
  const nd=e.target.closest('[data-node]');if(nd){netSel=+nd.dataset.node;return render()}
  const nmb=e.target.closest('[data-nm]');if(nmb){netMin=+nmb.dataset.nm;return render()}
  const t=e.target.closest('[data-t]'),p=e.target.closest('[data-p]'),c=e.target.closest('[data-cat]'),g=e.target.closest('[data-go]');
  if(t)return openTicket(+t.dataset.t);
  if(p)return openProduct(+p.dataset.p);
  if(c){selCat=c.dataset.cat;return go('categorias')}
  if(g)return go(g.dataset.go);
  const ts=e.target.closest('#tseg button');if(ts){tFilter=ts.dataset.k;return render()}
  const so=e.target.closest('#psort button');if(so){psort=so.dataset.k;return render()}
  const apb=e.target.closest('[data-ap]');if(apb){const k=apb.dataset.ap;applied.has(k)?applied.delete(k):applied.add(k);return render()}
  const spb=e.target.closest('[data-sup]');if(spb){const s=spb.dataset.sup;PROFILE.supers.has(s)?PROFILE.supers.delete(s):PROFILE.supers.add(s);return render()}
  if(e.target.dataset.pref){const k=e.target.dataset.pref;e.target.checked?PROFILE.prefs.add(k):PROFILE.prefs.delete(k);return}
  if(e.target.id==='saveP')return toast('Perfil guardado');
  if(e.target.id==='invite')return toast('Enlace de invitación copiado');
  if(e.target.id==='exportBtn')return toast('Te enviaremos tus datos por email en un CSV');
  if(e.target.id==='planBtn')return toast('Cambiar de plan llegará en la versión final');
  if(e.target.id==='deleteBtn')return toast('Para borrar la cuenta te pediremos confirmación por email');
  if(e.target.id==='share')return toast('Enlace de la lista copiado');
  if(e.target.id==='clear'){done.clear();return render()}
});
view.addEventListener('input',e=>{
  if(e.target.dataset.pf){PROFILE[e.target.dataset.pf]=e.target.value;return}
  if(e.target.id==='tq'){tq=e.target.value.toLowerCase();render();const i=document.getElementById('tq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if(e.target.id==='cq'){cq=e.target.value.toLowerCase();render();const i=document.getElementById('cq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  if(e.target.id==='pq'){pq=e.target.value.toLowerCase();render();const i=document.getElementById('pq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
});
view.addEventListener('change',e=>{
  if(e.target.id==='pcat'){pcat=e.target.value;render()}
  if(e.target.id==='ccat'){ccat=e.target.value;render()}
  if(e.target.dataset.l){const id=+e.target.dataset.l;e.target.checked?done.add(id):done.delete(id);render()}
});
dbody.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){editT=+ed.dataset.edit;return openTicket(editT)}
  const sv=e.target.closest('[data-save]');if(sv)return saveTicket(+sv.dataset.save);
  const cc=e.target.closest('[data-cancel]');if(cc){editT=null;return openTicket(+cc.dataset.cancel)}
  if(e.target.closest('[data-rmln]')){e.target.closest('tr').remove();return}
  if(e.target.closest('[data-addln]')){document.getElementById('eRows').insertAdjacentHTML('beforeend','<tr data-row><td><input class="edit-in" list="pnames" data-f="name" placeholder="Producto"></td><td class="n"><input class="edit-in n" type="number" min="0" step="1" data-f="qty" value="1"></td><td class="n"><input class="edit-in n" type="number" min="0" step="0.01" data-f="pu" placeholder="0,00"></td><td><button class="ln-x" data-rmln aria-label="Quitar línea">×</button></td></tr>');return document.querySelector('#eRows tr:last-child input').focus()}
  const ok=e.target.closest('[data-okf]');if(ok){FLAG.delete(ok.dataset.okf);render();openTicket(+ok.dataset.tk);return toast('Línea confirmada')}
  if(e.target.closest('[data-orig]'))return toast('En la app real verás aquí el ticket original');
  const nfb=e.target.closest('[data-nf]');if(nfb){nf=nfb.dataset.nf;return openAvisos()}
  const nb=e.target.closest('[data-n]');if(nb){const n=NS.find(x=>x.id===nb.dataset.n);readN.add(n.id);updateBell();closeAll();return setTimeout(n.act,180)}
  if(e.target.closest('[data-markall]')){NS.forEach(n=>readN.add(n.id));updateBell();return openAvisos()}
  if(e.target.closest('[data-avcfg]')){closeAll();return go('perfil')}
});
dbody.addEventListener('change',e=>{if(e.target.dataset.pc){P[+e.target.dataset.pc].cat=e.target.value;render();toast('Categoría actualizada en todas las compras')}});
render();
setTimeout(openOb,500);
</script>

</body></html>
