<style>
/* App móvil editorial: saludo en serif, tarjetas niebla, artefactos blancos flotando, pestañas en píldora */
:root{color-scheme:light;
  --ink:#17191c;--paper:#ffffff;--mist:#f2f2f3;--fog:#fafafb;--slate:#777b86;--ash:#979799;--smoke:#a3a6af;--peach:#fbe1d1;--sienna:#5d2a1a;--hair:#ececec;

  --serif:'Source Serif 4','Tiempos Headline',Georgia,serif;
  --ui:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --float:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --pop:0 0 0 1px rgba(0,0,0,.05),0 8px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fog);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.45;font-feature-settings:"tnum";overflow-x:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg text{font-family:var(--ui);font-weight:400}
.phone{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;display:flex;flex-direction:column}
.screen{flex:1;padding:8px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media(min-width:600px){
  body{padding-block:24px}
  .phone{min-height:0;height:calc(100vh - 48px);max-height:900px;border-radius:44px;overflow:hidden;box-shadow:var(--pop)}
  .scroll{overflow-y:auto}
}
.scroll{flex:1;display:flex;flex-direction:column}
html,.scroll,.sheet,.seg{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.disp{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.12}
.disp em{font-style:italic}
.lab{font-size:13px;color:var(--ash)}

.btn{font-size:14px;height:40px;padding:0 18px;border-radius:9999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}

.meter.over i{background:var(--sienna)}

/* cabecera */
.head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 4px max(18px,env(safe-area-inset-left,0px))}

.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--mist);aspect-ratio:16/9;display:flex;align-items:flex-end;padding:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo span{position:relative;font-size:12px;color:var(--slate);background:var(--paper);border-radius:9999px;padding:3px 10px}

.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* listas */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e4e4e6;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}

.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:12px;flex:none;background:var(--paper)!important}

.hbar .tr{height:6px;border-radius:9999px;background:var(--paper);overflow:hidden}

.seg{display:flex;gap:2px;background:var(--mist);padding:3px;border-radius:9999px;overflow-x:auto;align-self:flex-start;max-width:100%}
.seg button{border:none;background:none;border-radius:9999px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--slate)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

.stats b{display:block;font-weight:500;font-size:17px;margin-top:2px}
.rec{display:flex;flex-direction:column;gap:8px}
.rec .row b{font-weight:500}

/* pestañas */
.tabbar{position:sticky;bottom:0;z-index:10;padding:8px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(255,255,255,0),var(--paper) 40%)}
.tabbar nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;justify-items:center;align-items:center;column-gap:4px;background:var(--paper);box-shadow:var(--pop);border-radius:9999px;padding:6px}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 4px;border-radius:9999px;cursor:pointer;min-width:64px;color:var(--slate)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field input,.field select{border:1px solid var(--hair);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:15px;width:100%}
.chipt{border:1px solid var(--hair);background:var(--paper);border-radius:9999px;padding:7px 14px;cursor:pointer;font-size:13px}
.chipt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.chk-row input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.avatar-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--peach);color:var(--sienna);font-weight:500;font-size:12px;cursor:pointer}
.cat-row{width:100%;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.cat-row.sel span:first-child{font-weight:600}
.go{color:var(--smoke);font-size:22px;line-height:1}
.search{width:100%;border:1px solid var(--hair);border-radius:16px;padding:12px 16px;background:var(--paper);font-size:15px}
.search::placeholder{color:var(--smoke)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .pill{background:var(--mist);color:var(--ink)}
.tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink);background:var(--mist)}
.tabbar .plus{width:52px;height:52px;min-width:0;border-radius:50%;background:var(--ink);color:var(--paper);font-size:24px;line-height:1;padding:0;justify-content:center}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(23,25,28,.25);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(430px,100%);transform:translate(-50%,105%);transition:transform .28s;z-index:41;background:var(--paper);box-shadow:var(--pop);border-radius:28px 28px 0 0;max-height:86vh;overflow-y:auto;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.on{transform:translate(-50%,0)}
@media(min-width:600px){.sheet{bottom:24px;border-radius:28px}}
.grab{width:40px;height:4px;border-radius:9999px;background:var(--hair);margin:0 auto 16px}
.sheet h2{font-size:30px;margin:4px 0}
.sheet .pill{background:var(--mist)}
.prog{height:6px;border-radius:9999px;overflow:hidden;margin:16px 0 8px;background:var(--mist)}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s}
.drop{border:1px dashed var(--smoke);border-radius:16px;padding:26px 16px;text-align:center;background:var(--fog);margin-top:14px}
.drop svg{stroke:var(--ink);fill:none;stroke-width:1.3}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;transition:.25s;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:9999px;font-size:14px;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.prog i{transition:none}}
</style>

<script>
/* ---------- utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(11);
const num=(n,d=2)=>{let s=Math.abs(n).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'−':'')+s.join(',')};
const eur=n=>num(n)+' €';
const DAY=864e5;
const fd=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2);
const fdm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+1)%7));return x}; // semanas de sábado a viernes
function delta(v,goodDown=true){
  if(!isFinite(v))return '<span class="up-n">—</span>';
  if(Math.abs(v)<.005)return '<span class="up-n">= 0 %</span>';
  const up=v>0,good=goodDown?!up:up;
  return `<span class="${good?'up-g':'up-r'}">${up?'▲ +':'▼ −'}${num(Math.abs(v)*100,0)} %</span>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- datos de ejemplo ---------- */
const STORES={A:'Mercadona',B:'Carrefour',F:'Frutería'};
const SF={A:1,B:1.06,F:.95};
const CATS=['Fruta','Verdura','Carne','Pescado','Lácteos','Huevos','Panadería','Despensa','Bebidas','Congelados','Limpieza','Higiene'];
// [nombre, categoría, precio, kg?, prob. compra grande, prob. compra pequeña, prob. frutería, tendencia]
const RAW=[
['Leche semidesnatada x6','Lácteos',5.34,0,.85,.35,0,0],
['Yogur natural x8','Lácteos',1.95,0,.55,.25,0,.02],
['Queso fresco','Lácteos',2.10,0,.35,.1,0,0],
['Huevos L x12','Huevos',2.65,0,.6,.2,0,.08],
['Pan de molde integral','Panadería',1.45,0,.6,.35,0,0],
['Barra de pan','Panadería',.55,0,.5,.55,0,0],
['Pechuga de pollo','Carne',6.85,0,.7,.25,0,.03],
['Carne picada mixta','Carne',4.20,0,.35,.15,0,0],
['Jamón serrano lonchas','Carne',3.10,0,.35,.15,0,0],
['Salmón fresco','Pescado',7.90,0,.35,.1,0,.04],
['Merluza congelada','Congelados',5.40,0,.25,.05,0,0],
['Plátano canario','Fruta',2.19,1,.6,.2,.6,.05],
['Manzana golden','Fruta',1.89,1,.4,.1,.5,0],
['Naranja','Fruta',1.49,1,.3,.05,.5,-.03],
['Tomate rama','Verdura',2.49,1,.5,.2,.55,-.06],
['Cebolla','Verdura',1.29,1,.35,.1,.4,0],
['Lechuga','Verdura',.99,0,.35,.15,.45,0],
['Calabacín','Verdura',1.79,1,.25,.05,.35,.02],
['Pasta espagueti','Despensa',.95,0,.35,.15,0,0],
['Tomate frito','Despensa',.89,0,.12,.05,0,0],
['Arroz redondo 1 kg','Despensa',1.35,0,.2,.05,0,0],
['Aceite de oliva virgen extra 1 L','Despensa',8.95,0,.15,.12,0,.03],
['Cereales','Despensa',2.75,0,.15,.05,0,0],
['Café molido','Despensa',3.60,0,.2,.05,0,.06],
['Agua mineral 6x1,5 L','Bebidas',2.40,0,.5,.15,0,0],
['Zumo de naranja','Bebidas',1.85,0,.25,.1,0,0],
['Detergente','Limpieza',6.50,0,.12,.03,0,0],
['Papel de cocina','Limpieza',2.20,0,.15,.05,0,0],
['Higiene personal 01','Higiene',3.20,0,.15,.05,0,0],
['Higiene personal 02','Higiene',2.45,0,.12,.05,0,0]];
const P=RAW.map((r,i)=>({id:i,name:r[0],cat:r[1],price:r[2],kg:!!r[3],pb:r[4],ps:r[5],pf:r[6],trend:r[7]}));
const byName=n=>P.find(p=>p.name===n).id;
const CHAINS=['Mercadona','Carrefour','Lidl','Dia','Alcampo','Eroski'];
// precio de hoy en cada cadena (EJEMPLO: en la app real se leería de sus webs y apps)
function catalog(p){const r=mulberry32(1000+p.id*7);return CHAINS.map(c=>({c,pu:Math.round(p.price*(1+p.trend)*(1+(r()-.5)*.14)*100)/100})).sort((a,b)=>a.pu-b.pu)}
const START=new Date(2026,7,1), TODAY=new Date(2026,9,29);
function priceOf(p,st,d){
  let tr=p.trend; if(p.name.startsWith('Aceite')&&st==='B')tr=.14;
  const t=(d-START)/(TODAY-START);
  return Math.round(p.price*SF[st]*(1+tr*t)*(1+(R()-.5)*.03)*100)/100;
}
let TID=1;
function makeTicket(st,d,big){
  const ids=new Set();
  P.forEach(p=>{const pr=st==='F'?p.pf:(big?p.pb:p.ps);if(R()<pr)ids.add(p.id)});
  if(st!=='F'){
    const pairs=[['Pan de molde integral','Tomate rama',.6],['Barra de pan','Jamón serrano lonchas',.45],['Pasta espagueti','Tomate frito',.75],['Leche semidesnatada x6','Cereales',.3],['Yogur natural x8','Plátano canario',.45]];
    pairs.forEach(([a,b,pr])=>{if(ids.has(byName(a))&&R()<pr)ids.add(byName(b))});
  }
  if(ids.size<2){const pool=P.filter(p=>st==='F'?p.pf>0:true);while(ids.size<2)ids.add(pool[Math.floor(R()*pool.length)].id)}
  const lines=[...ids].map(id=>{const p=P[id];const q=p.kg?Math.round((.6+R()*1.2)*1000)/1000:(R()<.15?2:1);const pu=priceOf(p,st,d);return{pid:id,qty:q,pu,total:Math.round(q*pu*100)/100}});
  const date=new Date(d);date.setHours(9+Math.floor(R()*11),Math.floor(R()*60));
  return{id:TID++,date,store:st,lines,total:Math.round(lines.reduce((s,l)=>s+l.total,0)*100)/100};
}
let T=[];
for(let d=new Date(START);d<=TODAY;d=new Date(d.getTime()+DAY)){
  const w=d.getDay();
  if(w===6&&R()<.92)T.push(makeTicket('A',d,true));
  if(w===3&&R()<.6)T.push(makeTicket('B',d,false));
  if(w===1&&R()<.25)T.push(makeTicket('B',d,false));
  if((w===2||w===5)&&R()<.4)T.push(makeTicket('F',d,false));

/* ---------- cálculos ---------- */
const inMonth=(t,m)=>t.date.getMonth()===m&&t.date.getFullYear()===2026;
const sum=a=>a.reduce((s,x)=>s+x,0);
function weekly(n=12){
  const cur=wk(TODAY),out=[];
  for(let i=n-1;i>=0;i--){const s=new Date(cur.getTime()-i*7*DAY),e=new Date(s.getTime()+7*DAY);out.push({s,v:sum(T.filter(t=>t.date>=s&&t.date<e).map(t=>t.total))})}
  return out;
}
function catSpend(filter){const m={};CATS.forEach(c=>m[c]=0);T.filter(filter).forEach(t=>t.lines.forEach(l=>m[P[l.pid].cat]+=l.total));return m}
function productStats(){
  return P.map(p=>{
    const buys=T.filter(t=>t.lines.some(l=>l.pid===p.id)).sort((a,b)=>a.date-b.date);
    const lines=buys.map(t=>({d:t.date,st:t.store,...t.lines.find(l=>l.pid===p.id)}));
    const gaps=[];for(let i=1;i<buys.length;i++)gaps.push((buys[i].date-buys[i-1].date)/DAY);
    const every=gaps.length?sum(gaps)/gaps.length:NaN;
    const first=lines.slice(0,3),last=lines.slice(-3);
    const avg=a=>a.length?sum(a.map(x=>x.pu/SF[x.st]))/a.length:NaN;
    const varp=lines.length>=4?avg(last)/avg(first)-1:NaN;
    const lastD=buys.length?buys[buys.length-1].date:null;
    const since=lastD?(TODAY-lastD)/DAY:NaN;
    return{p,n:buys.length,every,varp,lastD,since,lastPu:lines.length?lines[lines.length-1].pu:NaN,lines,spend:sum(lines.map(l=>l.total))};
  });
}
function rules(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,c={},cc={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))];ids.forEach(a=>c[a]=(c[a]||0)+1);
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);cc[k]=(cc[k]||0)+1}});
  return Object.entries(cc).filter(([k,v])=>v>=4).map(([k,v])=>{const[a,b]=k.split('-').map(Number);
    const lift=(v/N)/((c[a]/N)*(c[b]/N));const[x,y]=c[a]<=c[b]?[a,b]:[b,a];
    return{a:x,b:y,sup:v/N,conf:v/c[x],lift,n:v}}).sort((a,b)=>b.lift-a.lift).slice(0,10);
}

/* ---------- cestas de 3 y 4 productos ---------- */
function baskets(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,cnt={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))].sort((a,b)=>a-b);
    const rec=(st,k,cur)=>{if(cur.length===k){const key=cur.join('-');cnt[key]=(cnt[key]||0)+1;return}for(let i=st;i<ids.length;i++){cur.push(ids[i]);rec(i+1,k,cur);cur.pop()}};
    rec(0,3,[]);rec(0,4,[]);});
  const out=Object.entries(cnt).map(([k,v])=>({ids:k.split('-').map(Number),n:v,sup:v/N}));
  const pick=k=>out.filter(o=>o.ids.length===k).sort((a,b)=>b.n-a.n).slice(0,4);
  return{N,b3:pick(3),b4:pick(4)};
}

const ALT={'Café molido':['Café molido marca del súper',.78],'Yogur natural x8':['Yogur natural marca del súper x8',.8],'Zumo de naranja':['Zumo de naranja marca del súper',.75],'Jamón serrano lonchas':['Jamón serrano en taco',.82],'Detergente':['Detergente marca del súper',.7],'Cereales':['Cereales marca del súper',.72]};
function recs(){
  const ps=productStats(),M=(TODAY-START)/DAY/30.4,out=[];
  ps.forEach(s=>{const la={};s.lines.forEach(l=>{if(l.st!=='F')la[l.st]=l});
    if(la.A&&la.B){const[hi,lo]=la.A.pu>la.B.pu?['A','B']:['B','A'];const d=la[hi].pu-la[lo].pu;
      if(d/la[hi].pu>.03){const q=sum(s.lines.filter(l=>l.st===hi).map(l=>l.qty))/M;out.push({type:'store',p:s.p,to:lo,pf:la[hi].pu,pt:la[lo].pu,save:d*q})}}
    const alt=ALT[s.p.name];if(alt&&s.n)out.push({type:'alt',p:s.p,alt:alt[0],pf:s.lastPu,pt:s.lastPu*alt[1],save:s.spend/M*(1-alt[1])});
  });

}

  <div class="card"><h3>Cestas de 3 y 4 productos</h3>${bk.b3.concat(bk.b4).map(o=>`<div class="li" style="cursor:default"><span class="pill">${o.ids.length}</span><span class="nm">${o.ids.map(i=>esc(P[i].name)).join(' + ')}</span><span class="amt">${num(o.sup*100,0)} %</span></div>`).join('')}<p class="cap">% de tus compras en el súper que incluyen la cesta completa</p></div>`};
S.donde=()=>{const oct=T.filter(t=>inMonth(t,9)),sep=T.filter(t=>inMonth(t,8)),so=sum(oct.map(t=>t.total));
  const rows=['A','B','F'].map(s=>{const L=oct.filter(t=>t.store===s);return{s,v:sum(L.map(t=>t.total)),p:sum(sep.filter(t=>t.store===s).map(t=>t.total)),n:L.length}}).sort((a,b)=>b.v-a.v);
  const days=[0,0,0,0,0,0,0];oct.forEach(t=>days[t.date.getDay()]+=t.total);const dmax=Math.max(...days);
  return `${BACK}<h1 class="disp" style="font-size:38px">Dónde <em>compras</em></h1><p class="tag" style="color:var(--slate)">Octubre</p>
  <div class="card"><h3>% del gasto</h3>${rows.map(r=>`<div class="hbar"><span>${STORES[r.s]}</span><div class="tr"><i style="width:${so?r.v/so*100:0}%"></i></div><span>${num(so?r.v/so*100:0,0)} %</span></div>`).join('')}</div>
  ${rows.map(r=>`<div class="card"><div class="row"><h3>${STORES[r.s]}</h3>${chg(r.v/r.p-1)}</div><div class="stats"><div><span class="lab">Gasto</span><b>${eur(r.v)}</b></div><div><span class="lab">Tickets</span><b>${r.n}</b></div><div><span class="lab">Ticket medio</span><b>${eur(r.n?r.v/r.n:0)}</b></div><div><span class="lab">Septiembre</span><b>${eur(r.p)}</b></div></div></div>`).join('')}
  <div class="card"><h3>Qué día compras</h3>${[1,2,3,4,5,6,0].map(d=>`<div class="hbar"><span>${DIA[d]}</span><div class="tr"><i style="width:${dmax?days[d]/dmax*100:0}%"></i></div><span>${eur(days[d])}</span></div>`).join('')}</div>`};

/* ---------- perfil (datos de ejemplo) ---------- */
const PROFILE={nombre:'Marta López',email:'marta@ejemplo.com',tel:'600 000 000',cp:'28010',ciudad:'Madrid',dia:'Sábado',presu:'20',supers:new Set(['Mercadona','Carrefour','Frutería del barrio']),prefs:new Set(['blanca','avisos','report'])};
const MEMBERS=[['Tú','Adulto · administra la cuenta'],['Ana','Adulto'],['Javi','Menor · 12 años'],['Lucía','Menor · 9 años']];

S.perfil=()=>`<button class="btn ghost sm back" data-sub="">← Inicio</button>
<section class="hero-m"><h1 class="disp" style="font-size:38px">Tu <em>perfil</em></h1><p class="tag">Datos de ejemplo</p></section>
<div class="card"><h3 style="margin-bottom:12px">Datos personales</h3>${pfField('nombre','Nombre')}${pfField('email','Email','email')}${pfField('tel','Teléfono','tel')}${pfField('cp','Código postal')}${pfField('ciudad','Ciudad')}</div>
<div class="card"><div class="row"><h3>Tu hogar</h3><span class="pill">${MEMBERS.length} de 4 incluidas</span></div>${MEMBERS.map(m=>`<div class="li" style="cursor:default"><span class="dot">${m[0][0]}</span><span class="nm"><b>${m[0]}</b><small>${m[1]}</small></span></div>`).join('')}<button class="btn ghost wide" id="invite" style="margin-top:10px">+ Invitar a alguien de casa</button><h3 style="margin:18px 0 4px">Cómo compráis</h3>${pfChecks(PREFS)}</div>
<div class="card"><div class="row"><h3>Tus supermercados</h3><span class="pill">${PROFILE.supers.size} elegidos</span></div><p class="cap" style="margin-bottom:10px">Para comparar precios y recomendarte dónde comprar.</p><div class="chips">${SUPS.map(s=>`<button class="chipt ${PROFILE.supers.has(s)?'on':''}" data-sup="${esc(s)}">${esc(s)}</button>`).join('')}</div>
<label class="field" style="margin-top:16px"><span class="lab">Día habitual de compra</span><select data-pf="dia">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'].map(d=>`<option ${PROFILE.dia===d?'selected':''}>${d}</option>`).join('')}</select></label>${pfField('presu','Objetivo de ahorro semanal (€)','number')}</div>
<div class="card"><h3>Cuentas y avisos</h3><div class="li" style="cursor:default"><span class="nm"><b>Gmail</b><small>Solo correos con «ticket» en el asunto</small></span><span class="pill">Conectado</span></div><div class="li" style="cursor:default"><span class="nm"><b>Precios de supermercados</b><small>Se leen de sus webs públicas</small></span></div>${pfChecks(AVISOS)}</div>
<div class="card"><h3>Plan y privacidad</h3><div class="li" style="cursor:default"><span class="nm"><b>Plan Familia · 6 €/mes</b><small>Hasta 4 personas · +1 €/mes por cada persona extra · se renueva el 1 de diciembre de 2026</small></span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" id="exportBtn">Exportar mis datos</button><button class="btn ghost sm" id="deleteBtn">Borrar cuenta</button></div></div>
<button class="btn wide" id="saveP">Guardar cambios</button>`;
let mq='';
S.precios=()=>{const ps=P.filter(p=>!mq||p.name.toLowerCase().includes(mq));
  return `<section class="hero-m"><h1 class="disp" style="font-size:38px">Compara <em>precios</em></h1><p class="tag">En ${CHAINS.length} supermercados · actualizado hoy, 08:00</p></section>
  <label for="mq" class="lab" style="position:absolute;left:-9999px">Buscar producto</label><input id="mq" class="search" placeholder="Busca un producto…" value="${esc(mq)}">
  <div class="chips">${CHAINS.map(c=>`<span class="pill">${c}</span>`).join('')}</div>
  <div class="card">${ps.map(p=>{const c=catalog(p);return `<button class="li" data-p="${p.id}"><span class="nm"><b>${esc(p.name)}</b><small>Más barato en ${c[0].c} · ${eur(c[c.length-1].pu-c[0].pu)} menos que en ${c[c.length-1].c}</small></span><span class="amt">${eur(c[0].pu)}${p.kg?'/kg':''}</span></button>`}).join('')||'<p class="cap">Ningún producto coincide</p>'}</div>
  <p class="lab">Precios de ejemplo. En la app real se leen de las webs y apps de cada supermercado.</p>`};
function listItems(){return productStats().filter(s=>s.n>=3&&isFinite(s.every)).map(s=>({...s,due:s.since/s.every})).filter(s=>s.due>=.8).sort((a,b)=>b.due-a.due)}
S.lista=()=>{
  const it=listItems(),est=sum(it.filter(s=>!done.has(s.p.id)).map(s=>s.lines[s.lines.length-1].total)),bk=baskets();
  return `<section class="hero-m">${stk('cart',60,'right:10px;top:0;transform:rotate(10deg)')}<h1 class="disp" style="font-size:38px">Tu <em>lista</em></h1></section>
  <div class="card c-lav"><div class="row"><span class="lab">Coste estimado</span><span class="pill">${it.length-[...done].filter(id=>it.some(s=>s.p.id===id)).length} pendientes</span></div><div class="big" style="margin-top:6px">${eur(est)}</div><div class="cap">La app no compra por ti: marca tú lo que te llevas.</div></div>
  <div class="card"><h3>Para esta semana</h3>${it.map(s=>`<button class="li ${done.has(s.p.id)?'done':''}" data-l="${s.p.id}"><span class="chk">${done.has(s.p.id)?'✓':''}</span><span class="nm"><b>${esc(s.p.name)}</b><small>Cada ${num(s.every,0)} días · hace ${num(s.since,0)}</small></span><span class="due"><i style="width:${Math.min(100,s.due*100)}%"></i></span></button>`).join('')}</div>
  <div class="card c-gray"><h3>Cestas que repites</h3><div class="cap" style="margin-bottom:6px">Si compras uno, revisa los demás</div>${bk.b3.slice(0,3).concat(bk.b4.slice(0,2)).map(o=>`<div class="li" style="cursor:default"><span class="pill p-sun">${o.ids.length}</span><span class="nm">${o.ids.map(i=>esc(P[i].name)).join(' + ')}</span><span class="amt">${num(o.sup*100,0)} %</span></div>`).join('')}</div>`;
};
S.objetivos=()=>{
  const{w,bAvg,target,cw}=ctx(),since=w.slice(8,-1),ok=since.filter(x=>x.v<=target).length,avgS=sum(since.map(x=>x.v))/since.length;
  const oct=T.filter(t=>inMonth(t,9)),sep=T.filter(t=>inMonth(t,8)),so=sum(oct.map(t=>t.total)),ss=sum(sep.map(t=>t.total));
  const topC=Object.entries(catSpend(t=>inMonth(t,9))).sort((a,b)=>b[1]-a[1])[0];
  const up=productStats().filter(s=>s.n>=4&&isFinite(s.varp)).sort((a,b)=>b.varp-a.varp)[0];
  return `<section class="hero-m">${stk('check',50,'right:12px;top:6px;transform:rotate(12deg)')}<h1 class="disp" style="font-size:38px">Tu <em>meta</em></h1></section>
  <div class="card"><span class="pill p-sun">Objetivo activo</span><h3 style="font-size:22px;margin-top:10px">Bajar ${GOAL} € a la semana</h3><div class="cap">Partías de ${eur(bAvg)} · objetivo ${eur(target)}</div><div style="margin-top:10px">${bars(w,8,target)}</div>
    <div class="stats"><div><span class="lab">Semanas cumplidas</span><b>${ok} de ${since.length}</b></div><div><span class="lab">Ahorro medio</span><b>${eur(bAvg-avgS)}/sem.</b></div><div><span class="lab">Esta semana</span><b>${eur(cw.v)}</b></div><div><span class="lab">Presupuesto mes</span><b>${eur(target*4.35)}</b></div></div></div>
  <div class="card c-lav"><div class="row"><h3>Report de octubre</h3><span class="pill">1 de noviembre</span></div>
    <div class="li" style="cursor:default"><span class="nm">Gasto total</span><span class="amt">${eur(so)}</span>${chg(so/ss-1)}</div>
    <div class="li" style="cursor:default"><span class="nm">Más gasto en</span><span class="amt">${topC[0]} · ${eur(topC[1])}</span></div>
    ${up?`<div class="li" style="cursor:default"><span class="nm">Lo que más sube</span><span class="amt">${esc(up.p.name)}</span>${chg(up.varp)}</div>`:''}
    <div class="li" style="cursor:default"><span class="nm">Tickets</span><span class="amt">${oct.length}</span></div></div>
  <div class="card"><div class="row"><h3>Retos en familia</h3><span class="pill p-mint">Plan Familia</span></div>
    ${[['Tú',140,'Lista cumplida 3 semanas','var(--sun)'],['Ana',115,'Mejor precio del mes','var(--lav)'],['Javi',70,'Primer ticket escaneado','var(--sky)'],['Lucía',45,'Primera semana en el objetivo','var(--mint)']].map(m=>`<div class="li" style="cursor:default"><span class="dot" style="background:${m[3]}">${m[0][0]}</span><span class="nm"><b>${m[0]}</b><small>${m[2]}</small></span><span class="amt">${m[1]} pts</span></div>`).join('')}
    <div class="card c-violet" style="margin-top:10px;padding:14px"><span class="lab">Reto de la semana</span><div style="margin-top:4px;font-weight:700">Comprar solo lo de la lista · 2 de 3</div><div class="meter"><i style="width:66%"></i></div></div></div>`;
};

/* ---------- hojas ---------- */
const sheet=document.getElementById('sheet'),sbody=document.getElementById('sbody'),scrim=document.getElementById('scrim');
function openSheet(html){sbody.innerHTML=html;sheet.classList.add('on');scrim.classList.add('on');sheet.scrollTop=0}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on')}
scrim.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function openTicket(id){const t=T.find(x=>x.id===id);openSheet(`<span class="lab">Ticket nº ${String(t.id).padStart(4,'0')}</span><h2 class="disp">${STORES[t.store]}</h2><div class="cap">${DIA[t.date.getDay()]} ${fd(t.date)} · ${hhmm(t.date)}</div>
  <div class="stats"><div><span class="lab">Total</span><b>${eur(t.total)}</b></div><div><span class="lab">Líneas</span><b>${t.lines.length}</b></div></div>
  <div style="margin-top:8px">${t.lines.map(l=>{const p=P[l.pid];return `<button class="li" data-p="${p.id}"><span class="nm"><b>${esc(p.name)}</b><small>${p.kg?num(l.qty,3)+' kg':l.qty+' ud.'} × ${eur(l.pu)}</small></span><span class="pill p-lav">${p.cat}</span><span class="amt">${eur(l.total)}</span></button>`}).join('')}</div>`)}
function openProduct(id){const s=productStats()[id],p=s.p;const ser=[['A','#17191c'],['B','#5d2a1a'],['F','#a3a6af']].map(([st,c])=>({c,pts:s.lines.filter(l=>l.st===st).map(l=>[l.d.getTime(),l.pu])}));
  openSheet(`<span class="pill p-lav">${p.cat}</span><h2 class="disp" style="font-size:34px;margin-top:10px">${esc(p.name)}</h2>
  <div class="stats"><div><span class="lab">Lo compras cada</span><b>${isFinite(s.every)?num(s.every,0)+' días':'—'}</b></div><div><span class="lab">Variación</span><b>${chg(s.varp)}</b></div></div>
  <h3 style="margin-top:18px">Hoy en cada supermercado</h3>${catalog(p).map((x,i)=>`<div class="li" style="cursor:default"><span class="nm">${x.c}</span>${i===0?'<span class="pill p-ember">Más barato</span>':''}<span class="amt">${eur(x.pu)}${p.kg?'/kg':''}</span></div>`).join('')}<p class="lab" style="margin-top:4px">Precios de ejemplo</p>
  <div class="row" style="margin-top:16px"><h3>Lo que has pagado</h3><span class="lab"><span style="color:#17191c">●</span> Mercadona <span style="color:#5d2a1a">●</span> Carrefour <span style="color:#a3a6af">●</span> Frutería</span></div>${line(ser)}
  <div style="margin-top:6px">${s.lines.slice().reverse().slice(0,6).map(l=>`<div class="li" style="cursor:default"><span class="nm">${fd(l.d)}<small>${STORES[l.st]}</small></span><span class="amt">${eur(l.pu)}</span></div>`).join('')}</div>`)}
function openUpload(){openSheet(`<span class="lab">Nuevo ticket</span><h2 class="disp">Añadir</h2>
  <div class="seg" style="margin-top:12px">${[['correo','Gmail'],['foto','Foto']].map(([k,l])=>`<button data-m="${k}" class="${upMode===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="drop">${upMode==='correo'?`<svg viewBox="0 0 66 62" width="54"><use href="#receipt"/></svg><div style="font-weight:700;margin-top:8px">Gmail conectado</div><div class="cap">Solo leemos los correos con «ticket» en el asunto.</div>`:`<svg viewBox="0 0 66 62" width="54"><use href="#cart"/></svg><div style="font-weight:700;margin-top:8px">Haz una foto al ticket</div><div class="cap">Que se vea entero, de arriba abajo.</div>`}</div>
  <div id="upst" class="cap" style="min-height:18px"></div><div class="prog"><i id="upbar"></i></div>
  <button class="btn wide" id="ugo" style="margin-top:8px">${upMode==='correo'?'Buscar tickets nuevos':'Abrir la cámara'}</button>`)}
function runUpload(){const steps=[upMode==='correo'?'Buscando correos con «ticket»…':'Leyendo la foto con IA…','Detectando productos…','Clasificando…','Listo'],bar=document.getElementById('upbar'),st=document.getElementById('upst');document.getElementById('ugo').disabled=true;
  steps.forEach((s,i)=>setTimeout(()=>{st.textContent=s;bar.style.width=((i+1)/steps.length*100)+'%';if(i===steps.length-1)setTimeout(()=>{const t=makeTicket('A',TODAY,true);t.src=upMode==='foto'?'Foto':'Gmail';t.date=new Date(2026,9,29,new Date().getHours(),new Date().getMinutes());T.unshift(t);render();toast(`Ticket añadido · ${eur(t.total)}`);openTicket(t.id)},350)},i*600))}

/* ---------- navegación ---------- */
const screen=document.getElementById('screen');
function render(){screen.innerHTML=(sub?S[sub]:S[tab])();document.querySelectorAll('#tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function go(t){tab=t;sub=null;render();document.getElementById('scroll').scrollTop=0;window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});
document.getElementById('plus').onclick=openUpload;
document.getElementById('perfilBtn').onclick=()=>{sub='perfil';render();document.getElementById('scroll').scrollTop=0;window.scrollTo(0,0)};
screen.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),g=e.target.closest('[data-go]'),s=e.target.closest('[data-sub]'),f=e.target.closest('[data-f]'),ap=e.target.closest('[data-ap]'),l=e.target.closest('[data-l]');
  const psb=e.target.closest('[data-ps]');if(psb){psort=psb.dataset.ps;return render()}
  const mcb=e.target.closest('[data-mc]');if(mcb){mcat=mcb.dataset.mc;return render()}
  const spb=e.target.closest('[data-sup]');if(spb){const s=spb.dataset.sup;PROFILE.supers.has(s)?PROFILE.supers.delete(s):PROFILE.supers.add(s);return render()}
  if(e.target.dataset.pref){const k=e.target.dataset.pref;e.target.checked?PROFILE.prefs.add(k):PROFILE.prefs.delete(k);return}
  if(e.target.id==='saveP')return toast('Perfil guardado');
  if(e.target.id==='invite')return toast('Enlace de invitación copiado');
  if(e.target.id==='exportBtn')return toast('Te enviaremos tus datos por email');
  if(e.target.id==='deleteBtn')return toast('Te pediremos confirmación por email');
  const pp=e.target.closest('[data-p]');if(pp)return openProduct(+pp.dataset.p);
  if(ap){const k=ap.dataset.ap;applied.has(k)?applied.delete(k):applied.add(k);return render()}
  if(t)return openTicket(+t.dataset.t);
  if(g)return go(g.dataset.go);
  if(s){sub=s.dataset.sub||null;render();window.scrollTo(0,0);document.getElementById('scroll').scrollTop=0;return}
  if(f){tFilter=f.dataset.f;return render()}
  if(l){const id=+l.dataset.l;done.has(id)?done.delete(id):done.add(id);return render()}
});
screen.addEventListener('input',e=>{if(e.target.dataset.pf){PROFILE[e.target.dataset.pf]=e.target.value;return}if(e.target.id==='mq'){mq=e.target.value.toLowerCase();render();const i=document.getElementById('mq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
sbody.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');
  if(p)return openProduct(+p.dataset.p);
  if(m){upMode=m.dataset.m;return openUpload()}
  if(e.target.id==='ugo')runUpload();
});
render();
</script>
