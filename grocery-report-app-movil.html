<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Grocery Report Móvil</title>

<style>
/* App móvil editorial: saludo en serif, tarjetas niebla, artefactos blancos flotando, pestañas en píldora */
:root{color-scheme:light;
  --ink:#17191c;--paper:#ffffff;--mist:#f2f2f3;--fog:#fafafb;--slate:#777b86;--ash:#979799;--smoke:#a3a6af;--peach:#fbe1d1;--sienna:#5d2a1a;--hair:#ececec;
  --lav:var(--mist);--sky:var(--mist);--mint:var(--mist);--sun:var(--peach);--soft:var(--slate);
  --serif:'Source Serif 4','Tiempos Headline',Georgia,serif;
  --ui:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --float:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --pop:0 0 0 1px rgba(0,0,0,.05),0 8px 40px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fog);color:var(--ink);font-family:var(--ui);font-weight:400;font-size:15px;line-height:1.45;font-feature-settings:"tnum";overflow-x:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg text{font-family:var(--ui);font-weight:400}
.phone{max-width:430px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;display:flex;flex-direction:column}
.screen{flex:1;padding:8px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media(min-width:600px){
  body{padding-block:24px}
  .phone{min-height:0;height:calc(100vh - 48px);max-height:900px;border-radius:44px;overflow:hidden;box-shadow:var(--pop)}
  .scroll{overflow-y:auto}
}
.scroll{flex:1;display:flex;flex-direction:column}
html,.scroll,.sheet,.seg{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.disp{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.12}
.disp em{font-style:italic}
.lab{font-size:13px;color:var(--ash)}
.muted{color:var(--slate)}
.card{background:var(--mist);border-radius:24px;padding:18px}
.c-lav,.c-gray{background:var(--mist)}
.c-mint{background:var(--peach);color:var(--sienna)}
.c-mint .lab,.c-mint .cap{color:var(--sienna)}
.c-violet{background:var(--paper)}
.art{background:var(--paper);box-shadow:var(--float);border-radius:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:9999px;background:var(--paper);white-space:nowrap;color:var(--slate)}
.p-ember{background:var(--peach);color:var(--sienna)}
.p-sky,.p-lav,.p-sun,.p-mint{background:var(--paper);color:var(--ink)}
.card .pill.p-sky,.card .pill.p-lav,.card .pill.p-sun{background:var(--paper)}
.c-mint .pill{background:rgba(255,255,255,.6);color:var(--sienna)}
.btn{font-size:14px;height:40px;padding:0 18px;border-radius:9999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.wide{width:100%;height:46px}

.big{font-weight:500;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.mid{font-weight:500;font-size:21px;letter-spacing:-.015em;margin:4px 0 6px}
.cap{font-size:13px;color:var(--slate);margin-top:6px}
h3{font-weight:500;font-size:17px;letter-spacing:-.009em}
.meter{height:6px;border-radius:9999px;background:var(--mist);overflow:hidden;margin-top:12px}
.card .meter{background:var(--paper)}
.meter i{display:block;height:100%;background:var(--ink);border-radius:9999px}
.meter.over i{background:var(--sienna)}

/* cabecera */
.head{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 4px max(18px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--serif);font-size:19px;letter-spacing:-.01em}
.logo em{font-style:italic}
.logo i{display:none}
.hero-m{padding:10px 0 4px}
.hero-m h1{font-size:38px}
.hero-m .tag{font-size:16px;color:var(--slate);margin-top:8px}
.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--mist);aspect-ratio:16/9;display:flex;align-items:flex-end;padding:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo span{position:relative;font-size:12px;color:var(--slate);background:var(--paper);border-radius:9999px;padding:3px 10px}
.photo svg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:40px;height:40px;stroke:var(--smoke);fill:none;stroke-width:1.2}
.photo svg.illo{left:0;top:0;transform:none;width:100%;height:100%;stroke:none}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kgrid .card{padding:16px;border:none}
.back{align-self:flex-start}

/* listas */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e4e4e6;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.sheet .li{border-bottom-color:var(--hair)}
.li:last-child{border-bottom:none}

.hbar .tr{height:6px;border-radius:9999px;background:var(--paper);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--ink);border-radius:9999px}
.hbar span:last-child{text-align:right;font-weight:500}
.seg{display:flex;gap:2px;background:var(--mist);padding:3px;border-radius:9999px;overflow-x:auto;align-self:flex-start;max-width:100%}
.seg button{border:none;background:none;border-radius:9999px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--slate)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chk{width:24px;height:24px;border-radius:50%;border:1px solid var(--smoke);background:var(--paper);display:grid;place-items:center;flex:none;font-size:13px;color:var(--paper)}
.li.done .chk{background:var(--ink);border-color:var(--ink)}
.li.done .nm b{text-decoration:line-through;color:var(--smoke)}
.due{width:48px;height:5px;border-radius:9999px;overflow:hidden;background:var(--paper);flex:none}
.due i{display:block;height:100%;background:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stats div{border-radius:16px;padding:10px 12px;background:var(--paper)}
.sheet .stats div{background:var(--mist)}
.c-mint .stats div{background:rgba(255,255,255,.55)}
.stats b{display:block;font-weight:500;font-size:17px;margin-top:2px}
.rec{display:flex;flex-direction:column;gap:8px}
.rec .row b{font-weight:500}

/* pestañas */
.tabbar{position:sticky;bottom:0;z-index:10;padding:8px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(255,255,255,0),var(--paper) 40%)}
.tabbar nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;justify-items:center;align-items:center;column-gap:4px;background:var(--paper);box-shadow:var(--pop);border-radius:9999px;padding:6px}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 4px;border-radius:9999px;cursor:pointer;min-width:64px;color:var(--slate)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field input,.field select{border:1px solid var(--hair);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:15px;width:100%}
.chipt{border:1px solid var(--hair);background:var(--paper);border-radius:9999px;padding:7px 14px;cursor:pointer;font-size:13px}
.chipt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.chk-row input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.avatar-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--peach);color:var(--sienna);font-weight:500;font-size:12px;cursor:pointer}
.cat-row{width:100%;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.cat-row.sel span:first-child{font-weight:600}
.go{color:var(--smoke);font-size:22px;line-height:1}
.search{width:100%;border:1px solid var(--hair);border-radius:16px;padding:12px 16px;background:var(--paper);font-size:15px}
.search::placeholder{color:var(--smoke)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .pill{background:var(--mist);color:var(--ink)}
.tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink);background:var(--mist)}
.tabbar .plus{width:52px;height:52px;min-width:0;border-radius:50%;background:var(--ink);color:var(--paper);font-size:24px;line-height:1;padding:0;justify-content:center}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(23,25,28,.25);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(430px,100%);transform:translate(-50%,105%);transition:transform .28s;z-index:41;background:var(--paper);box-shadow:var(--pop);border-radius:28px 28px 0 0;max-height:86vh;overflow-y:auto;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.on{transform:translate(-50%,0)}
@media(min-width:600px){.sheet{bottom:24px;border-radius:28px}}
.grab{width:40px;height:4px;border-radius:9999px;background:var(--hair);margin:0 auto 16px}
.sheet h2{font-size:30px;margin:4px 0}
.sheet .pill{background:var(--mist)}
.prog{height:6px;border-radius:9999px;overflow:hidden;margin:16px 0 8px;background:var(--mist)}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s}
.drop{border:1px dashed var(--smoke);border-radius:16px;padding:26px 16px;text-align:center;background:var(--fog);margin-top:14px}
.drop svg{stroke:var(--ink);fill:none;stroke-width:1.3}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;transition:.25s;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:9999px;font-size:14px;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.prog i{transition:none}}

/* nuevas piezas: avisos, prueba, corrección de tickets, bienvenida, plan, privacidad, tu año */
.head .logo{white-space:nowrap}
.sheet{visibility:hidden;transition:transform .28s,visibility 0s .28s}.sheet.on{visibility:visible;transition:transform .28s}
@media(max-width:420px){.head .logo{font-size:17px}.head .pill{font-size:11px;padding:2px 8px}.head .hbtn,.head .avatar-btn{width:34px;height:34px}.head>div:last-child{gap:6px!important}}
.hbtn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0}
.hbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hbtn b{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9999px;background:var(--sienna);color:var(--paper);font-size:10.5px;font-weight:500;display:grid;place-items:center;padding:0 4px}
.hbtn b:empty{display:none}
.trial{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);border-radius:20px;padding:10px 10px 10px 16px;font-size:13px;background:var(--fog)}
.trial span{flex:1}
.nt{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border:none;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;background:none;text-align:left;font:inherit;color:inherit}
.nt .dt{width:8px;height:8px;border-radius:50%;background:var(--sienna);margin-top:7px;flex:none}
.nt.read .dt{background:transparent}
.nt.read .nm{color:var(--slate)}
.nt .nm{flex:1;font-size:14px}
.nt small{display:block;color:var(--slate);font-size:12.5px;margin-top:2px}
.ocr{display:block;font-size:11px;color:var(--ash);letter-spacing:.03em;margin-top:2px}
.rev{background:var(--peach);color:var(--sienna);border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;font-size:13px}
.rev span{flex:1}
.erow{display:grid;grid-template-columns:1fr 62px 70px 28px;gap:6px;align-items:start;padding:10px 0;border-bottom:1px solid var(--hair)}
.edit-in{border:1px solid var(--hair);border-radius:10px;padding:8px 9px;font-size:14px;width:100%;background:var(--paper);min-width:0}
.edit-in.n{text-align:right}
.ln-x{border:none;background:var(--mist);width:28px;height:28px;border-radius:50%;cursor:pointer;margin-top:4px}
.ob{position:absolute;inset:0;z-index:35;background:var(--paper);display:none;flex-direction:column;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));scrollbar-width:none}
.ob::-webkit-scrollbar{display:none}
.ob.on{display:flex}
@media(max-width:599px){.ob{position:fixed}}
.ob h1{font-size:34px;margin:6px 0 8px}
.ob h1 em{font-style:italic}
.ob .foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots i{width:22px;height:4px;border-radius:9999px;background:var(--hair)}
.dots i.on{background:var(--ink)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--hair);border-radius:16px;padding:14px;cursor:pointer;margin-top:10px;background:var(--paper);text-align:left;width:100%;font:inherit;color:inherit}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:2px}
.opt b{font-weight:500}
.opt small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.ok-list{list-style:none;margin:10px 0}
.ok-list li{padding:9px 0 9px 24px;position:relative;font-size:14px;border-bottom:1px solid #e4e4e6}
.ok-list li:before{content:'✓';position:absolute;left:2px}
.ob-steps p{font-size:14px;color:var(--smoke);padding:5px 0}
.ob-steps p.on{color:var(--ink)}
.insight{background:var(--peach);color:var(--sienna);border-radius:20px;padding:20px;margin-top:8px}
.insight .lab{color:var(--sienna)}
.insight .big{font-family:var(--serif);font-weight:400;font-size:44px}
.skip{border:none;background:none;color:var(--slate);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center}
.plan{background:var(--mist);border-radius:24px;padding:18px}
.plan.cur{background:var(--paper);box-shadow:var(--float)}
.plan .pr{font-family:var(--serif);font-size:34px;letter-spacing:-.02em;line-height:1.1}
.plan ul{list-style:none;margin:8px 0 14px;font-size:13.5px;color:var(--slate)}
.plan li{padding:3px 0}
.yr-hero{background:var(--peach);color:var(--sienna);border-radius:24px;padding:22px}
.yr-hero .lab{color:var(--sienna)}
.yr-hero h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.12;letter-spacing:-.015em;margin:8px 0 10px}
.yr-hero h2 em{font-style:italic}
.yr .card{padding:16px;display:flex;flex-direction:column;gap:2px}
.yr .v{font-family:var(--serif);font-size:23px;line-height:1.15;margin:4px 0 2px}
.yr .v em{font-style:italic}
.yr .card.ink{background:var(--ink);color:var(--paper)}
.yr .card.ink .lab,.yr .card.ink .cap{color:var(--smoke)}
.c-teaser{background:var(--peach);color:var(--sienna);border:none;text-align:left;cursor:pointer;width:100%;font:inherit}
.c-teaser .lab{color:var(--sienna)}

/* inicio simplificado */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:none;background:var(--mist);border-radius:20px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile b{font-weight:500}
.tile small{font-size:12.5px;color:var(--slate)}
.tile.pe{background:var(--peach);color:var(--sienna)}
.tile.pe small{color:var(--sienna)}
</style>

<script>
/* ---------- utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const num=(n,d=2)=>{let s=Math.abs(n).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'−':'')+s.join(',')};

function delta(v,goodDown=true){
  if(!isFinite(v))return '<span class="up-n">—</span>';
  if(Math.abs(v)<.005)return '<span class="up-n">= 0 %</span>';
  const up=v>0,good=goodDown?!up:up;
  return `<span class="${good?'up-g':'up-r'}">${up?'▲ +':'▼ −'}${num(Math.abs(v)*100,0)} %</span>`;
}

const START=new Date(2026,7,1), TODAY=new Date(2026,9,29);
function priceOf(p,st,d){
  let tr=p.trend; if(p.name.startsWith('Aceite')&&st==='B')tr=.14;
  const t=(d-START)/(TODAY-START);
  return Math.round(p.price*SF[st]*(1+tr*t)*(1+(R()-.5)*.03)*100)/100;
}
let TID=1;
function makeTicket(st,d,big){
  const ids=new Set();
  P.forEach(p=>{const pr=st==='F'?p.pf:(big?p.pb:p.ps);if(R()<pr)ids.add(p.id)});
  if(st!=='F'){
    const pairs=[['Pan de molde integral','Tomate rama',.6],['Barra de pan','Jamón serrano lonchas',.45],['Pasta espagueti','Tomate frito',.75],['Leche semidesnatada x6','Cereales',.3],['Yogur natural x8','Plátano canario',.45]];
    pairs.forEach(([a,b,pr])=>{if(ids.has(byName(a))&&R()<pr)ids.add(byName(b))});
  }
  if(ids.size<2){const pool=P.filter(p=>st==='F'?p.pf>0:true);while(ids.size<2)ids.add(pool[Math.floor(R()*pool.length)].id)}
  const lines=[...ids].map(id=>{const p=P[id];const q=p.kg?Math.round((.6+R()*1.2)*1000)/1000:(R()<.15?2:1);const pu=priceOf(p,st,d);return{pid:id,qty:q,pu,total:Math.round(q*pu*100)/100}});
  const date=new Date(d);date.setHours(9+Math.floor(R()*11),Math.floor(R()*60));
  return{id:TID++,date,store:st,lines,total:Math.round(lines.reduce((s,l)=>s+l.total,0)*100)/100};
}
let T=[];

  if(w===6&&R()<.92)T.push(makeTicket('A',d,true));

  if(w===1&&R()<.25)T.push(makeTicket('B',d,false));
  if((w===2||w===5)&&R()<.4)T.push(makeTicket('F',d,false));
}

/* ---------- cálculos ---------- */
const inMonth=(t,m)=>t.date.getMonth()===m&&t.date.getFullYear()===2026;
const sum=a=>a.reduce((s,x)=>s+x,0);
function weekly(n=12){
  const cur=wk(TODAY),out=[];
  for(let i=n-1;i>=0;i--){const s=new Date(cur.getTime()-i*7*DAY),e=new Date(s.getTime()+7*DAY);out.push({s,v:sum(T.filter(t=>t.date>=s&&t.date<e).map(t=>t.total))})}
  return out;
}
function catSpend(filter){const m={};CATS.forEach(c=>m[c]=0);T.filter(filter).forEach(t=>t.lines.forEach(l=>m[P[l.pid].cat]+=l.total));return m}
function productStats(){
  return P.map(p=>{
    const buys=T.filter(t=>t.lines.some(l=>l.pid===p.id)).sort((a,b)=>a.date-b.date);
    const lines=buys.map(t=>({d:t.date,st:t.store,...t.lines.find(l=>l.pid===p.id)}));
    const gaps=[];for(let i=1;i<buys.length;i++)gaps.push((buys[i].date-buys[i-1].date)/DAY);
    const every=gaps.length?sum(gaps)/gaps.length:NaN;
    const first=lines.slice(0,3),last=lines.slice(-3);
    const avg=a=>a.length?sum(a.map(x=>x.pu/SF[x.st]))/a.length:NaN;
    const varp=lines.length>=4?avg(last)/avg(first)-1:NaN;
    const lastD=buys.length?buys[buys.length-1].date:null;
    const since=lastD?(TODAY-lastD)/DAY:NaN;
    return{p,n:buys.length,every,varp,lastD,since,lastPu:lines.length?lines[lines.length-1].pu:NaN,lines,spend:sum(lines.map(l=>l.total))};
  });
}
function rules(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,c={},cc={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))];ids.forEach(a=>c[a]=(c[a]||0)+1);
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);cc[k]=(cc[k]||0)+1}});
  return Object.entries(cc).filter(([k,v])=>v>=4).map(([k,v])=>{const[a,b]=k.split('-').map(Number);
    const lift=(v/N)/((c[a]/N)*(c[b]/N));const[x,y]=c[a]<=c[b]?[a,b]:[b,a];
    return{a:x,b:y,sup:v/N,conf:v/c[x],lift,n:v}}).sort((a,b)=>b.lift-a.lift).slice(0,10);
}

/* ---------- cestas de 3 y 4 productos ---------- */
function baskets(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,cnt={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))].sort((a,b)=>a-b);
    const rec=(st,k,cur)=>{if(cur.length===k){const key=cur.join('-');cnt[key]=(cnt[key]||0)+1;return}for(let i=st;i<ids.length;i++){cur.push(ids[i]);rec(i+1,k,cur);cur.pop()}};
    rec(0,3,[]);rec(0,4,[]);});
  const out=Object.entries(cnt).map(([k,v])=>({ids:k.split('-').map(Number),n:v,sup:v/N}));
  const pick=k=>out.filter(o=>o.ids.length===k).sort((a,b)=>b.n-a.n).slice(0,4);
  return{N,b3:pick(3),b4:pick(4)};
}

/* ---------- recomendaciones de ahorro ---------- */
const ALT={'Café molido':['Café molido marca del súper',.78],'Yogur natural x8':['Yogur natural marca del súper x8',.8],'Zumo de naranja':['Zumo de naranja marca del súper',.75],'Jamón serrano lonchas':['Jamón serrano en taco',.82],'Detergente':['Detergente marca del súper',.7],'Cereales':['Cereales marca del súper',.72]};
function recs(){
  const ps=productStats(),M=(TODAY-START)/DAY/30.4,out=[];
  ps.forEach(s=>{const la={};s.lines.forEach(l=>{if(l.st!=='F')la[l.st]=l});
    if(la.A&&la.B){const[hi,lo]=la.A.pu>la.B.pu?['A','B']:['B','A'];const d=la[hi].pu-la[lo].pu;
      if(d/la[hi].pu>.03){const q=sum(s.lines.filter(l=>l.st===hi).map(l=>l.qty))/M;out.push({type:'store',p:s.p,to:lo,pf:la[hi].pu,pt:la[lo].pu,save:d*q})}}
    const alt=ALT[s.p.name];if(alt&&s.n)out.push({type:'alt',p:s.p,alt:alt[0],pf:s.lastPu,pt:s.lastPu*alt[1],save:s.spend/M*(1-alt[1])});
  });
  return out.filter(r=>r.save>=.3).sort((a,b)=>b.save-a.save);
}

function bars(data,hiFrom,target){
  const W=360,H=170,pl=30,pb=22,pt=16,max=Math.max(target?target*1.25:0,...data.map(d=>d.v))*1.1||1,bw=(W-pl)/data.length,Y=v=>H-pb-(H-pt-pb)*v/max;
  let g='';for(let i=0;i<=3;i++){const v=max*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e4e4e6"/><text x="${pl-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#777b86">${num(v,0)}</text>`}
  data.forEach((d,i)=>{const x=pl+i*bw+bw*.15,y=Y(d.v),hi=i>=hiFrom;g+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${Math.max(.5,H-pb-y)}" rx="5" fill="${hi?'#17191c':'#d9dadd'}" stroke="none"><title>Semana del ${fdm(d.s)} · ${eur(d.v)}</title></rect>`;if((data.length-1-i)%3===0)g+=`<text x="${x+bw*.35}" y="${H-6}" font-size="9" text-anchor="middle" fill="#777b86">${fdm(d.s)}</text>`});

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto por semana">${g}</svg>`;
}
function line(series){
  const W=340,H=150,pl=36,pt=10,pb=20,pts=series.flatMap(s=>s.pts);if(!pts.length)return'';
  const x0=START.getTime(),x1=TODAY.getTime();let y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));const pad=(y1-y0)*.3||y1*.1;y0-=pad;y1+=pad;
  const X=t=>pl+(W-pl-8)*(t-x0)/(x1-x0),Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0));
  let g='';for(let i=0;i<=2;i++){const v=y0+(y1-y0)*i/2;g+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e4e4e6"/><text x="${pl-5}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#777b86">${num(v)}</text>`}
  [7,8,9].forEach(m=>{g+=`<text x="${X(new Date(2026,m,1).getTime())+3}" y="${H-5}" font-size="9" fill="#777b86">${MES[m].slice(0,3).toUpperCase()}</text>`});
  series.forEach(s=>{if(!s.pts.length)return;const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');g+=`<path d="${d}" fill="none" stroke="none" stroke-width="4.5"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="3"/>`+s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${s.c}" stroke="none"/>`).join('')});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Precio en el tiempo">${g}</svg>`;
}

function pairStats(){
  const tk=T.filter(t=>t.store!=='F'),N=tk.length,c={},cc={};
  tk.forEach(t=>{const ids=[...new Set(t.lines.map(l=>l.pid))];ids.forEach(a=>c[a]=(c[a]||0)+1);
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const k=Math.min(ids[i],ids[j])+'-'+Math.max(ids[i],ids[j]);cc[k]=(cc[k]||0)+1}});
  const all=Object.entries(cc).map(([k,v])=>{const[a,b]=k.split('-').map(Number);return{a,b,n:v,sup:v/N,lift:(v/N)/((c[a]/N)*(c[b]/N))}});
  return{N,c,all};
}

  const ids=[...new Set(edges.flatMap(r=>[r.a,r.b]))];
  const deg={};edges.forEach(r=>{deg[r.a]=(deg[r.a]||0)+1;deg[r.b]=(deg[r.b]||0)+1});
  if(netSel===null||!ids.includes(netSel))netSel=ids.slice().sort((x,y)=>(deg[y]||0)-(deg[x]||0)||st.c[y]-st.c[x])[0];
  return{...st,edges,ids,deg};
}

function netLayout(d,W,H){

    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=pos[d.ids[i]],B=pos[d.ids[j]];let dx=A.x-B.x,dy=(A.y-B.y)*1.6;let dist=Math.hypot(dx,dy)||.01;const f=k*k/dist;dx/=dist;dy/=dist;
      disp[d.ids[i]].x+=dx*f;disp[d.ids[i]].y+=dy*f;disp[d.ids[j]].x-=dx*f;disp[d.ids[j]].y-=dy*f}
    d.edges.forEach(e=>{const A=pos[e.a],B=pos[e.b];let dx=A.x-B.x,dy=A.y-B.y;const dist=Math.hypot(dx,dy)||.01;const f=dist*dist/k*(.6+e.lift*.25);dx/=dist;dy/=dist;
      disp[e.a].x-=dx*f;disp[e.a].y-=dy*f;disp[e.b].x+=dx*f;disp[e.b].y+=dy*f});
    d.ids.forEach(id=>{const p=pos[id],q=disp[id];q.x+=(W/2-p.x)*.35;q.y+=(H/2-p.y)*.6;const L=Math.hypot(q.x,q.y)||1;
      p.x=Math.min(W-padX,Math.max(padX,p.x+q.x/L*Math.min(L,t)));p.y=Math.min(H-padY,Math.max(padY,p.y+q.y/L*Math.min(L,t)))});
  }
  const xs=d.ids.map(i=>pos[i].x),ys=d.ids.map(i=>pos[i].y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*padX)/((x1-x0)||1),(H-2*padY-30)/((y1-y0)||1)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;

  const bySt={};T.forEach(t=>bySt[t.store]=(bySt[t.store]||0)+t.total);const fav=Object.entries(bySt).sort((a,b)=>b[1]-a[1])[0];

const fkey=(t,pid)=>t.id+'-'+pid;
const flagged=t=>t.lines.filter(l=>FLAG.has(fkey(t,l.pid)));
(function(){const t=T[0];[1,3].forEach(i=>t.lines[i]&&FLAG.add(fkey(t,t.lines[i].pid)));T.slice(1).forEach(t=>t.lines.forEach(l=>{if((t.id*7+l.pid*3)%41===0)FLAG.add(fkey(t,l.pid))}))})();
const ocr=(name,bad)=>{let s=name.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().split(' ').map(w=>w.slice(0,5)).join(' ').slice(0,24);if(bad)s=s.replace(/O/g,'0').replace(/E/,'3').replace(/A(?=[^A]*$)/,'4');return s};
let editT=null;
function openTicket(id){
  const t=T.find(x=>x.id===id),fl=flagged(t);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(editT===id){
    return openSheet(`<span class="lab">Corregir ticket nº ${String(t.id).padStart(4,'0')}</span><h2 class="disp">Corrige lo que <em>no cuadre</em></h2>
    <p class="cap">Si escribes un producto que ya tienes, se une a él y su historial sigue junto.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><label class="field"><span class="lab">Tienda</span><select id="eSt">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${t.store===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span class="lab">Fecha</span><input id="eDt" type="date" value="${iso(t.date)}"></label></div>
    <datalist id="pnames">${P.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
    <div class="erow" style="padding-bottom:4px"><span class="lab">Producto</span><span class="lab" style="text-align:right">Cant.</span><span class="lab" style="text-align:right">Precio</span><span></span></div>
    <div id="eRows">${t.lines.map(l=>{const p=P[l.pid],f=FLAG.has(fkey(t,l.pid));return `<div class="erow" data-row><div><input class="edit-in" list="pnames" data-f="name" value="${esc(p.name)}" ${f?'style="border-color:var(--sienna)"':''}><span class="ocr">Leído: ${ocr(p.name,f)}</span></div><input class="edit-in n" type="number" inputmode="decimal" min="0" step="${p.kg?'0.001':'1'}" data-f="qty" value="${l.qty}"><input class="edit-in n" type="number" inputmode="decimal" min="0" step="0.01" data-f="pu" value="${l.pu.toFixed(2)}"><button class="ln-x" data-rmln aria-label="Quitar línea">×</button></div>`}).join('')}</div>
    <button class="btn ghost sm" data-addln style="margin-top:12px">+ Añadir línea</button>
    <button class="btn wide" data-save="${t.id}" style="margin-top:16px">Guardar cambios</button><button class="btn ghost wide" data-cancel="${t.id}" style="margin-top:8px">Cancelar</button>`);
  }
  openSheet(`<span class="lab">Ticket nº ${String(t.id).padStart(4,'0')} · ${isMail(t)?'Gmail':'Foto'}</span><h2 class="disp">${STORES[t.store]}</h2><div class="cap">${DIA[t.date.getDay()]} ${fd(t.date)} · ${hhmm(t.date)}</div>
  <div class="stats"><div><span class="lab">Total</span><b>${eur(t.total)}</b></div><div><span class="lab">Líneas</span><b>${t.lines.length}</b></div></div>
  ${fl.length?`<div class="rev"><span><b style="font-weight:500">${fl.length} ${fl.length>1?'líneas':'línea'} por revisar.</b> La IA no está segura de haberlas leído bien.</span><button class="btn ghost sm" data-edit="${t.id}" style="border-color:var(--sienna);color:var(--sienna)">Corregir</button></div>`:''}
  <div style="margin-top:8px">${t.lines.map(l=>{const p=P[l.pid],f=FLAG.has(fkey(t,l.pid));return `<div class="li" style="cursor:default"><span class="nm" data-p="${p.id}" style="cursor:pointer"><b>${esc(p.name)}</b>${f?' <span class="pill p-ember">Revisar</span>':''}<span class="ocr">Leído: ${ocr(p.name,f)}</span><small>${p.kg?num(l.qty,3)+' kg':l.qty+' ud.'} × ${eur(l.pu)}</small></span>${f?`<button class="btn ghost sm" data-okf="${fkey(t,l.pid)}" data-tk="${t.id}">Está bien</button>`:`<span class="pill p-lav">${p.cat}</span>`}<span class="amt">${eur(l.total)}</span></div>`}).join('')}</div>
  <button class="btn ghost wide" data-edit="${t.id}" style="margin-top:12px">Corregir ticket</button>`);
}
function saveTicket(id){
  const t=T.find(x=>x.id===id),lines=[];
  sbody.querySelectorAll('[data-row]').forEach(r=>{
    const name=r.querySelector('[data-f=name]').value.trim(),qty=parseFloat(r.querySelector('[data-f=qty]').value)||0,pu=parseFloat(r.querySelector('[data-f=pu]').value)||0;
    if(!name||!qty)return;
    let p=P.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!p){p={id:P.length,name,cat:'Despensa',price:pu,kg:false,pb:0,ps:0,pf:0,trend:0};P.push(p)}
    const ex=lines.find(l=>l.pid===p.id);
    if(ex){ex.qty+=qty;ex.total=Math.round(ex.qty*ex.pu*100)/100}else lines.push({pid:p.id,qty,pu,total:Math.round(qty*pu*100)/100});
  });
  if(!lines.length)return toast('Necesita al menos una línea');
  t.lines=lines;t.total=Math.round(sum(lines.map(l=>l.total))*100)/100;t.store=sbody.querySelector('#eSt').value;
  const dv=sbody.querySelector('#eDt').value.split('-').map(Number);if(dv.length===3){const d=new Date(t.date);d.setFullYear(dv[0],dv[1]-1,dv[2]);t.date=d}
  [...FLAG].filter(k=>k.startsWith(t.id+'-')).forEach(k=>FLAG.delete(k));
  T.sort((a,b)=>b.date-a.date);editT=null;render();openTicket(id);toast('Ticket corregido');
}

/* ---------- bienvenida ---------- */
const ob={step:0,src:'correo',ok:false,anon:false,goal:GOAL};
const obEl=document.getElementById('ob');
function openOb(){ob.step=0;closeSheet();obRender();obEl.classList.add('on');obEl.scrollTop=0}
function closeOb(){obEl.classList.remove('on')}
function obRender(){
  const dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=ob.step?'on':''}"></i>`).join('')}</div>`;
  const mail='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',cam='<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  if(ob.step===0)obEl.innerHTML=`${dots}<div class="logo">The Grocery <em>Report</em></div><h1 class="disp" style="margin-top:28px">Lo que gastas en el súper, <em>por fin</em> claro</h1>
   <p class="cap" style="font-size:15px">Empieza con los tickets que ya tienes. Elige cómo:</p>
   <button class="opt ${ob.src==='correo'?'on':''}" data-obs="correo">${mail}<span><b>Conectar Gmail</b><small>Recomendado. Importamos los tickets de los últimos 3 meses y los nuevos llegan solos</small></span></button>
   <button class="opt ${ob.src==='foto'?'on':''}" data-obs="foto">${cam}<span><b>Hacer fotos a mis tickets</b><small>Sin conectar nada</small></span></button>
   <div class="foot"><button class="btn wide" data-obnext>Continuar</button><button class="skip" data-obskip>Saltar la bienvenida</button></div>`;
  if(ob.step===1)obEl.innerHTML=`${dots}<span class="lab">Tus datos</span><h1 class="disp">Antes de nada, <em>tu privacidad</em></h1>
   <ul class="ok-list">${ob.src==='correo'?'<li>Solo leemos correos con «ticket» en el asunto</li><li>El resto de tu correo no se abre ni se guarda</li>':'<li>Las fotos se borran al leerlas, salvo que elijas guardarlas</li>'}<li>No vendemos tus datos ni tenemos acuerdos con supermercados</li><li>Puedes descargar tus datos o borrar tu cuenta cuando quieras</li></ul>
   <label class="chk-row"><input type="checkbox" data-obok ${ob.ok?'checked':''}>Acepto la política de privacidad y las condiciones</label>
   <label class="chk-row"><input type="checkbox" data-obanon ${ob.anon?'checked':''}>Opcional: usar mis precios de forma anónima para mejorar el comparador</label>
   <div class="foot"><button class="btn wide" data-obnext ${ob.ok?'':'disabled'}>${ob.src==='correo'?'Conectar con Google':'Continuar'}</button><button class="skip" data-obback>Atrás</button></div>`;
  if(ob.step===2){
    const st=ob.src==='correo'?['Buscando correos con «ticket» desde el 1 de agosto…',`${T.length} tickets encontrados`,'Leyendo productos y precios con IA…','Ordenando en 12 categorías…','Buscando dónde puedes ahorrar…']:['Abriendo la cámara…','Leyendo el ticket con IA…','Ordenando en 12 categorías…','Para la demo, añadimos tickets de ejemplo…','Buscando dónde puedes ahorrar…'];
    obEl.innerHTML=`${dots}<span class="lab">${ob.src==='correo'?'Importando':'Leyendo'}</span><h1 class="disp">Un momento, <em>leyendo tickets</em></h1><div class="ob-steps" style="margin-top:10px">${st.map(s=>`<p>${s}</p>`).join('')}</div><div class="prog"><i id="obbar"></i></div>`;
    const ps=obEl.querySelectorAll('.ob-steps p'),bar=document.getElementById('obbar');
    ps.forEach((p,i)=>setTimeout(()=>{if(ob.step!==2)return;p.classList.add('on');bar.style.width=((i+1)/ps.length*100)+'%';if(i===ps.length-1)setTimeout(()=>{if(ob.step===2){ob.step=3;obRender()}},600)},i*550));
  }
  if(ob.step===3){
    const tot=sum(T.map(t=>t.total)),wkAvg=tot/((TODAY-START)/DAY+1)*7,save=sum(recs().map(r=>r.save)),up=productStats().filter(s=>s.n>=4&&isFinite(s.varp)).sort((a,b)=>b.varp-a.varp)[0];
    obEl.innerHTML=`${dots}<span class="lab">Tu primer resumen</span><h1 class="disp">Esto dicen tus <em>tickets</em></h1>
    <div class="insight"><span class="lab">Desde el 1 de agosto</span><div class="big">${eur(tot)}</div><div style="font-size:14px">en ${T.length} tickets · unos ${eur(wkAvg)} a la semana</div></div>
    <div class="stats"><div style="background:var(--mist)"><span class="lab">Puedes ahorrar</span><b>${eur(save)}/mes</b></div><div style="background:var(--mist)"><span class="lab">Lo que más sube</span><b>${up?esc(up.p.name.split(' ').slice(0,2).join(' '))+' +'+num(up.varp*100,0)+' %':'—'}</b></div></div>
    <p style="font-size:14px;margin:18px 0 8px">¿Cuánto quieres bajar a la semana?</p><div class="chips">${[10,20,30].map(g=>`<button class="chipt ${ob.goal===g?'on':''}" data-obg="${g}">${g} €</button>`).join('')}</div>
    <div class="foot"><p class="cap" style="text-align:center">Empiezas 30 días gratis con el plan Familia. Sin tarjeta.</p><button class="btn wide" data-obdone>Ir a mi resumen</button></div>`;
  }
}
obEl.addEventListener('click',e=>{
  const s=e.target.closest('[data-obs]');if(s){ob.src=s.dataset.obs;return obRender()}
  const g=e.target.closest('[data-obg]');if(g){ob.goal=+g.dataset.obg;return obRender()}
  if(e.target.closest('[data-obnext]')){ob.step++;obEl.scrollTop=0;return obRender()}
  if(e.target.closest('[data-obback]')){ob.step--;return obRender()}
  if(e.target.closest('[data-obskip]'))return closeOb();
  if(e.target.closest('[data-obdone]')){GOAL=ob.goal;PROFILE.presu=String(ob.goal);PRIV.anon=ob.anon;PRIV.gmail=ob.src==='correo';closeOb();go('inicio');return toast(`Meta: bajar ${ob.goal} € a la semana`)}
});
obEl.addEventListener('change',e=>{
  if(e.target.matches('[data-obok]')){ob.ok=e.target.checked;obEl.querySelector('[data-obnext]').disabled=!ob.ok}
  if(e.target.matches('[data-obanon]'))ob.anon=e.target.checked;
});

/* ---------- navegación ---------- */
const screen=document.getElementById('screen');
function render(){screen.innerHTML=(sub?S[sub]:S[tab])();updateBell();document.querySelectorAll('#tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function go(t){tab=t;sub=null;render();document.getElementById('scroll').scrollTop=0;window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});
document.getElementById('plus').onclick=openUpload;
document.getElementById('bellBtn').onclick=openAvisos;
document.getElementById('perfilBtn').onclick=()=>{sub='perfil';render();document.getElementById('scroll').scrollTop=0;window.scrollTo(0,0)};
screen.addEventListener('click',e=>{
  const nd=e.target.closest('[data-node]');if(nd){netSel=+nd.dataset.node;return render()}
  const nmb=e.target.closest('[data-nm]');if(nmb){netMin=+nmb.dataset.nm;return render()}
  const pl=e.target.closest('[data-plan]');if(pl){planSel=pl.dataset.plan;render();return toast(planSel==='familia'?'Sigues en el plan Familia':`Al terminar la prueba: plan ${PLANS.find(x=>x[0]===planSel)[1]}`)}
  const cy=e.target.closest('[data-cy]');if(cy){cycle=cy.dataset.cy;return render()}
  if(e.target.dataset.priv){PRIV[e.target.dataset.priv]=e.target.checked;render();return toast('Permiso actualizado')}
  if(e.target.id==='discGmail'){PRIV.gmail=!PRIV.gmail;render();return toast(PRIV.gmail?'Gmail conectado':'Gmail desconectado')}
  if(e.target.id==='delPhotos')return toast('Fotos borradas · tus tickets se quedan');
  if(e.target.id==='payBtn')return toast('Se abre el pago de la tienda de apps');
  if(e.target.id==='deleteBtn')return openDelete();
  if(e.target.closest('#obAgain'))return openOb();
  if(e.target.id==='shareYr')return toast(hideAmt?'Imagen lista, sin importes':'Imagen lista para compartir');
  if(e.target.id==='hideAmt'){hideAmt=e.target.checked;return render()}
  const t=e.target.closest('[data-t]'),g=e.target.closest('[data-go]'),s=e.target.closest('[data-sub]'),f=e.target.closest('[data-f]'),ap=e.target.closest('[data-ap]'),l=e.target.closest('[data-l]');
  const psb=e.target.closest('[data-ps]');if(psb){psort=psb.dataset.ps;return render()}
  const mcb=e.target.closest('[data-mc]');if(mcb){mcat=mcb.dataset.mc;return render()}
  const spb=e.target.closest('[data-sup]');if(spb){const s=spb.dataset.sup;PROFILE.supers.has(s)?PROFILE.supers.delete(s):PROFILE.supers.add(s);return render()}
  if(e.target.dataset.pref){const k=e.target.dataset.pref;e.target.checked?PROFILE.prefs.add(k):PROFILE.prefs.delete(k);return}
  if(e.target.id==='saveP')return toast('Perfil guardado');
  if(e.target.id==='invite')return toast('Enlace de invitación copiado');
  if(e.target.id==='exportBtn')return toast('Te enviaremos tus datos por email');
  if(e.target.id==='deleteBtn')return toast('Te pediremos confirmación por email');
  const pp=e.target.closest('[data-p]');if(pp)return openProduct(+pp.dataset.p);
  if(ap){const k=ap.dataset.ap;applied.has(k)?applied.delete(k):applied.add(k);return render()}
  if(t)return openTicket(+t.dataset.t);
  if(g)return go(g.dataset.go);
  if(s){sub=s.dataset.sub||null;render();window.scrollTo(0,0);document.getElementById('scroll').scrollTop=0;return}
  if(f){tFilter=f.dataset.f;return render()}
  if(l){const id=+l.dataset.l;done.has(id)?done.delete(id):done.add(id);return render()}
});
screen.addEventListener('input',e=>{if(e.target.dataset.pf){PROFILE[e.target.dataset.pf]=e.target.value;return}if(e.target.id==='mq'){mq=e.target.value.toLowerCase();render();const i=document.getElementById('mq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
sbody.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){editT=+ed.dataset.edit;return openTicket(editT)}
  const sv=e.target.closest('[data-save]');if(sv)return saveTicket(+sv.dataset.save);
  const cc=e.target.closest('[data-cancel]');if(cc){editT=null;return openTicket(+cc.dataset.cancel)}
  if(e.target.closest('[data-rmln]')){e.target.closest('[data-row]').remove();return}
  if(e.target.closest('[data-addln]')){document.getElementById('eRows').insertAdjacentHTML('beforeend','<div class="erow" data-row><div><input class="edit-in" list="pnames" data-f="name" placeholder="Producto"></div><input class="edit-in n" type="number" inputmode="decimal" min="0" step="1" data-f="qty" value="1"><input class="edit-in n" type="number" inputmode="decimal" min="0" step="0.01" data-f="pu" placeholder="0,00"><button class="ln-x" data-rmln aria-label="Quitar línea">×</button></div>');return document.querySelector('#eRows [data-row]:last-child input').focus()}
  const ok=e.target.closest('[data-okf]');if(ok){FLAG.delete(ok.dataset.okf);render();openTicket(+ok.dataset.tk);return toast('Línea confirmada')}
  const nfb=e.target.closest('[data-nf]');if(nfb){nf=nfb.dataset.nf;return openAvisos()}
  const nb=e.target.closest('[data-n]');if(nb){const n=NS.find(x=>x.id===nb.dataset.n);readN.add(n.id);updateBell();closeSheet();return setTimeout(n.act,220)}
  if(e.target.closest('[data-markall]')){NS.forEach(n=>readN.add(n.id));updateBell();return openAvisos()}
  if(e.target.closest('[data-avcfg]')){closeSheet();return openSub('perfil')}
  if(e.target.closest('[data-delok]')){closeSheet();return toast('Solicitud recibida · en el prototipo no se borra nada')}
  if(e.target.closest('[data-close]'))return closeSheet();
  const p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');
  if(p)return openProduct(+p.dataset.p);
  if(m){upMode=m.dataset.m;return openUpload()}
  if(e.target.id==='ugo')runUpload();
});
render();
openOb();
</script>

</body></html>
